<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Viewpoint Adverbs Live</title>
<style>
:root{--ink:#1f1630;--mut:#6b6478;--line:#efe7f1;--rose:#be185d;--plum:#4a044e;--blue:#1368ce;--green:#26890c;--org:#d97706;--pur:#7c3aed;--red:#e21b3c;--yel:#d89e00}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;color:var(--ink);background:#fff;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);z-index:30}
.brand{font-weight:800;display:flex;gap:10px;align-items:center;font-size:17px}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fde68a 0 18%,#f9a8d4 20% 60%,#ec4899 62%);display:inline-block}
.tabs{display:flex;gap:4px;background:#f7f1f8;padding:4px;border-radius:12px}
.tabs button{padding:8px 16px;border-radius:9px;background:transparent;color:var(--mut);font-weight:700}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
main{max-width:1100px;margin:0 auto;padding:24px 22px 110px}
main.wide{max-width:none;padding:0}
.kick{font-size:13px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--c,var(--rose))}
h1{font-size:clamp(28px,4vw,44px);margin:6px 0 8px;line-height:1.1}
h3{margin:26px 0 10px;font-size:19px}
.lead{font-size:clamp(17px,2vw,21px);color:var(--mut);margin:0 0 18px;line-height:1.45;max-width:860px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.pill{padding:9px 16px;border-radius:999px;border:2px solid var(--c);background:#fff;color:var(--c);font-weight:700;transition:.15s}
.pill.on,.pill:hover{background:var(--c);color:#fff}
.card{border:1px solid var(--line);border-left:6px solid var(--c,var(--rose));border-radius:16px;padding:18px 20px;background:#fdfbfd;margin:10px 0}
.card .q{font-weight:800;font-size:19px;margin-bottom:10px;color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.chips button{padding:6px 12px;border-radius:9px;background:#fff;border:1px solid var(--line);font-size:16px}.chips button.on{background:var(--c);color:#fff;border-color:var(--c)}
.idea{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 6px}.ib{flex:1 1 170px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:19px;font-weight:600}.ib small{display:block;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:800;margin-bottom:6px}.op{display:grid;place-items:center;font-size:28px;font-weight:900;color:var(--mut)}
.means{margin:10px 0;font-size:19px;background:#fff;border-radius:12px;padding:10px 14px;border:2px dashed var(--c)}
.chips span{padding:5px 11px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:15px}
.sent{font-size:clamp(21px,2.8vw,32px);font-weight:600;line-height:1.5;margin:6px 0}
.hl{background:var(--c,var(--rose));color:#fff;padding:1px 9px;border-radius:9px;font-weight:800;white-space:nowrap}
.cm{color:var(--red);font-weight:900;font-size:1.25em;padding:0 1px}
.note{font-size:16px;color:var(--mut);margin-top:6px}
.tag{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:800;color:#fff;background:var(--c)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:800px){.grid2,.grid4{grid-template-columns:1fr}}
.btn{padding:11px 20px;border-radius:12px;background:var(--ink);color:#fff;font-weight:800}
.btn.ghost{background:#f3eef5;color:var(--ink)}
.btn.rose{background:linear-gradient(135deg,#ec4899,#be185d);color:#fff;box-shadow:0 8px 24px rgba(190,24,93,.3)}
.btn:disabled{opacity:.4;cursor:default}
.quiz{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.word{font-size:32px;font-weight:800}
.ok{background:#16a34a!important;color:#fff!important;border-color:#16a34a!important}
.bad{background:#e21b3c!important;color:#fff!important;border-color:#e21b3c!important}
.foot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:12px 22px;background:rgba(255,255,255,.95);border-top:1px solid var(--line);z-index:20}
.dots{display:flex;gap:7px}
.dots b{width:10px;height:10px;border-radius:50%;background:#e8dfea;cursor:pointer}
.dots b.on{background:var(--rose);width:26px;border-radius:6px}
.toks{display:flex;flex-wrap:wrap;align-items:center;gap:2px;font-size:clamp(20px,2.6vw,30px);font-weight:600;line-height:2}
.gap{width:26px;height:34px;border:2px dashed #d8c8de;border-radius:8px;background:#fff;margin:0 3px;transition:.15s}
.gap:hover{border-color:var(--pur);background:#f3e8ff}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.form-row{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.form-row .lab{font-weight:800;color:var(--org)}
@media(max-width:700px){.form-row{grid-template-columns:1fr}}
.recap{border-radius:16px;padding:16px;background:#fff;border:1px solid var(--line);border-top:6px solid var(--c)}
.recap b{color:var(--c);font-size:14px;letter-spacing:1px;text-transform:uppercase}
.recap p{margin:8px 0 0;font-size:16px;line-height:1.45}
.lvl{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font-weight:800;font-size:14px}
.lvl.usual{background:#dcfce7;color:#166534}.lvl.emph{background:#e0e7ff;color:#3730a3}.lvl.less{background:#fef3c7;color:#92400e}.lvl.rare{background:#fee2e2;color:#991b1b}

/* ---------- lobby with cherry tree ---------- */
.lobby{position:relative;height:calc(100vh - 57px);min-height:560px;overflow:hidden;background:linear-gradient(180deg,#f4fbf3 0%,#e8f5e4 60%,#dcefd6 100%);perspective:1300px}
.fx{position:absolute;inset:0}
.fx canvas{display:block;width:100%;height:100%}
.intro{position:absolute;left:0;right:0;bottom:7%;text-align:center;transition:transform 1s ease,opacity .7s ease}
.intro h1{font-size:clamp(34px,5vw,62px);margin:4px 0 18px;text-shadow:0 2px 0 #fff}
.btn.big{font-size:20px;padding:15px 30px;border-radius:16px}
.intro{pointer-events:none}.intro .btn{pointer-events:auto}.hint{margin-top:10px;font-weight:700;color:var(--mut)}
.lobby.lifting .intro{transform:translateY(60px);opacity:0}
.lobby.lifting .intro .btn{pointer-events:none}
.scan{text-align:center;padding-bottom:10px;border-bottom:1px solid #f5d0e1}
.qrwrap{position:absolute;left:50%;bottom:4%;transform-origin:50% 100%;transform:translate(-50%,115%) rotateX(80deg) scale(.7);opacity:0;transition:transform 1.5s cubic-bezier(.17,.9,.25,1.12) .55s,opacity .6s ease .55s;pointer-events:none}
.lobby.nofx.revealed .qrwrap{transform:translate(-50%,0) rotateX(0) scale(1);opacity:1;pointer-events:auto}
.qrcard{background:#fff;border-radius:28px;padding:18px 20px 16px;text-align:center;box-shadow:0 30px 70px rgba(131,24,67,.28),0 0 0 8px rgba(255,255,255,.55);position:relative}
.qrcard:before{content:"";position:absolute;inset:-3px;border-radius:30px;background:linear-gradient(135deg,#f9a8d4,#be185d,#7c3aed);z-index:-1}
.qrlab{font-weight:900;font-size:22px;letter-spacing:.5px;background:linear-gradient(90deg,#be185d,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
#qrc{width:min(300px,38vh);height:min(300px,38vh);display:block;margin:0 auto}
.code{margin-top:8px;font-size:15px;color:var(--mut)}
.code b{font-size:24px;letter-spacing:4px;color:var(--plum)}
.url{font-size:12px;color:var(--mut);margin-top:4px;word-break:break-all;max-width:320px}
.side{position:absolute;right:18px;top:18px;width:290px;max-height:calc(100% - 36px);display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(131,24,67,.12)}
.side h4{margin:0;font-size:16px;display:flex;justify-content:space-between}
.plist{display:flex;flex-wrap:wrap;gap:6px;overflow:auto;max-height:42vh}
.plist span{padding:6px 11px;border-radius:999px;background:#fff;border:1px solid #cfe8c9;font-weight:700;font-size:14px;animation:pop .35s}
.plist span.off{opacity:.4}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.side select{padding:8px;border-radius:10px;border:1px solid var(--line);font:inherit;width:100%}
.warn{font-size:13px;background:#fef3c7;color:#92400e;border-radius:10px;padding:8px 10px}
@media(max-width:900px){.side{position:absolute;top:auto;bottom:12px;right:12px;width:220px}.qrwrap{left:38%}}

/* ---------- host question / reveal ---------- */
.hq{max-width:1150px;margin:0 auto;padding:22px}
.hqtop{display:flex;align-items:center;gap:14px}
.qn{font-weight:700;color:var(--mut)}
.tm{margin-left:auto;width:64px;height:64px;border-radius:50%;background:var(--plum);color:#fff;font-size:28px;font-weight:900;display:grid;place-items:center}
.tbar{height:8px;background:#f3eaf2;border-radius:6px;margin:14px 0;overflow:hidden}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#ec4899,#7c3aed);transition:width .25s linear}
.qtext{font-size:clamp(24px,3.2vw,40px);line-height:1.25;margin:16px 0 22px;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{position:relative;display:flex;align-items:center;gap:14px;min-height:92px;padding:16px 20px;border-radius:14px;color:#fff;font-weight:800;font-size:clamp(17px,2vw,24px);box-shadow:0 5px 0 rgba(0,0,0,.18);text-align:left}
.opt .sh{font-size:28px;opacity:.9}
.opt.dim{opacity:.28}
.opt.right{outline:5px solid #16a34a;outline-offset:3px}
.opt .cnt{margin-left:auto;background:rgba(255,255,255,.25);border-radius:10px;padding:4px 12px;font-size:20px}
.hqfoot{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
.answered{font-size:20px}
.who{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.who span{padding:4px 10px;border-radius:999px;background:#f3eef5;font-size:13px;font-weight:700;color:var(--mut)}
.who span.done{background:#dcfce7;color:#166534}
.expl{margin:18px 0;padding:14px 18px;border-radius:14px;background:#f5f3ff;border-left:6px solid var(--pur);font-size:18px;line-height:1.45}
.board{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:46px 1fr 110px;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:#fbf8fc}
.row .rk{font-weight:900;font-size:18px;color:var(--rose)}
.row .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{text-align:right;font-weight:900;font-size:18px}
.pdots{display:flex;gap:4px;flex-wrap:wrap}
.pdots i{width:12px;height:12px;border-radius:4px;background:#ece4ee}
.pdots i.y{background:#16a34a}.pdots i.n{background:#e21b3c}.pdots i.s{background:#c4b5c9}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:16px;margin:24px 0}
.pod{width:180px;text-align:center}
.pod .bar{border-radius:14px 14px 0 0;color:#fff;font-size:42px;font-weight:900;display:grid;place-items:center}
.pod .pn{font-weight:900;font-size:20px;margin-bottom:4px}
.pod .ps{color:var(--mut);font-weight:700;margin-bottom:8px}

/* ---------- player (phone) ---------- */
body.player{background:linear-gradient(180deg,#fff7fb,#ffeef5)}
.pw{max-width:520px;margin:0 auto;padding:18px;min-height:100vh;display:flex;flex-direction:column}
.pcard{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 30px rgba(131,24,67,.12);text-align:center}
.pcard input{width:100%;padding:14px;border-radius:12px;border:2px solid #f5d0e1;font:inherit;font-size:20px;text-align:center;margin:14px 0}
.ptop{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--mut);margin-bottom:8px}
.ptm{font-size:22px;color:var(--plum)}
.pq{font-size:20px;font-weight:700;line-height:1.35;margin:6px 0 14px}
.popts{display:grid;gap:10px;flex:1}
.popts button{border-radius:16px;color:#fff;font-weight:800;font-size:18px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.18);min-height:66px}
.popts button.pick{outline:5px solid var(--ink);outline-offset:2px}
.popts button.faded{opacity:.3}
.big-ico{font-size:66px;line-height:1;margin:8px 0}
.pts{font-size:30px;font-weight:900;color:var(--rose)}
.catbar{display:grid;grid-template-columns:90px 1fr 46px;gap:10px;align-items:center;margin:8px 0;text-align:left;font-weight:700}
.catbar .tr{height:12px;background:#f3eaf2;border-radius:8px;overflow:hidden}
.catbar .tr i{display:block;height:100%}
.spin{width:44px;height:44px;border:5px solid #f5d0e1;border-top-color:var(--rose);border-radius:50%;animation:spn 1s linear infinite;margin:14px auto}
@keyframes spn{to{transform:rotate(360deg)}}
.introbox{text-align:center;max-width:900px;margin:30px auto 0}
.introbox .ready{font-size:22px;font-weight:800;color:var(--mut);margin:8px 0}
.pic{flex:1;min-height:200px;border-radius:22px;background:linear-gradient(135deg,#ecfdf5,#fdf2f8);display:grid;place-items:center;font-size:clamp(70px,10vw,130px);letter-spacing:8px;box-shadow:inset 0 0 0 2px #f1e8f3}
.pic.big{min-height:230px;margin-bottom:6px}
.qbar{background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:14px 20px;text-align:center;font-size:clamp(22px,2.8vw,34px);margin:14px 0}
.mid{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.ring{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#7c3aed calc(var(--p)*1%),#efe7f1 0);flex:none}
.ring span{width:88px;height:88px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:38px;font-weight:900;color:var(--plum)}
.acount{width:110px;text-align:center;flex:none}.acount b{display:block;font-size:46px;line-height:1}.acount span{color:var(--mut);font-weight:700}
.bars{display:flex;justify-content:center;align-items:flex-end;gap:22px;height:190px;margin:4px 0 14px}
.bcol{display:flex;flex-direction:column;align-items:center;width:90px}.bcol.dim{opacity:.35}
.bnum{font-weight:900;font-size:22px;margin-bottom:4px}.bfill{width:100%;border-radius:8px 8px 0 0}.bsh{width:100%;color:#fff;text-align:center;font-size:20px;padding:4px 0;border-radius:0 0 8px 8px}
.qsel{font-size:15px}.netst{font-size:12px;color:var(--mut);font-weight:700}.agenda{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}@media(max-width:800px){.agenda{grid-template-columns:1fr}}.ag{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:16px;padding:14px 16px;transition:.15s}.ag:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.08)}.agn{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900;flex:none}.agi{font-size:30px}.ag b{display:block;font-size:19px;color:var(--c)}.ag small{display:block;font-size:15px;color:var(--mut);margin-top:2px}.hswitch{display:inline-flex;background:#f3eef5;border-radius:999px;padding:4px;margin:4px 0 10px}.hswitch button{padding:9px 18px;border-radius:999px;background:transparent;font-weight:800;font-size:17px}.hswitch button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}.hqtop .btn{margin-left:8px}.endarm{background:#e21b3c;color:#fff}.nsel{display:flex;gap:6px;margin-top:6px}.nsel button{flex:1;padding:8px 0;border-radius:10px;background:#fff;border:2px solid #cfe8c9;font-weight:800}.nsel button.on{background:#166534;border-color:#166534;color:#fff}
#pv{position:fixed;inset:0;background:#fbfafc;z-index:60;display:flex;flex-direction:column}
.pvhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line)}
.pvtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.shuf{font-weight:700;display:flex;gap:6px;align-items:center;padding:0 6px}
.pvbody{overflow:auto;padding:6px 22px 40px}
.pvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pvc{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;opacity:.55;transition:.12s}
.pvc.on{border-color:var(--c);opacity:1;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.pvtop{display:flex;align-items:center;gap:8px}.pvchk{width:24px;height:24px;border-radius:7px;border:2px solid var(--c);display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px}.pvc.on .pvchk{background:var(--c)}
.pvimg{font-size:26px}.pvq{font-weight:700;margin:8px 0;font-size:15px;line-height:1.35}
.pvo{display:grid;gap:4px;font-size:13px}.pvo span{display:flex;gap:6px;align-items:center;color:var(--mut)}.pvo i{width:10px;height:10px;border-radius:3px;flex:none}.pvo .ok2{color:#166534;font-weight:800}.pvo .ok2:after{content:" ✓"}
@media(max-width:700px){.mid{flex-wrap:wrap}.pic{min-height:140px}}
.pic{position:relative;overflow:hidden}
.pic .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic .sticker{position:absolute;right:12px;bottom:10px;font-size:44px;letter-spacing:0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.pic .credit{position:absolute;left:10px;bottom:8px;font-size:11px;letter-spacing:0;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:6px;font-weight:600}
.pic .emo{font-size:inherit}
.pic.big{min-height:300px;max-width:620px;margin:0 auto 8px}
.mid .pic{min-height:260px}
.pic.mini{min-height:120px;font-size:54px;border-radius:12px;margin-top:8px}.pic.mini .sticker{font-size:26px;right:6px;bottom:4px}
.swap{padding:4px 10px;font-size:16px;margin-left:6px}
.avlab{font-weight:800;color:var(--mut);margin:4px 0 8px}
.avgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.avgrid button{font-size:30px;padding:6px 0;border-radius:12px;background:#f7f3f8;border:3px solid transparent;line-height:1.2}
.avgrid button.on{border-color:var(--rose);background:#fff;transform:scale(1.08)}
.plist span .av{font-size:20px;margin-right:6px;vertical-align:-2px}
.nm .av{font-size:22px;margin-right:8px;vertical-align:-3px}
.pav{font-size:54px;line-height:1;margin-bottom:4px;animation:pop .5s}
.bounce{animation:bnc 1.2s ease-in-out infinite}@keyframes bnc{50%{transform:translateY(-10px)}}
.show{position:relative;height:calc(100vh - 57px);min-height:560px;overflow:hidden;background:radial-gradient(circle at 50% 35%,#3b1a5a 0%,#160a24 70%);color:#fff}
.spot{position:absolute;inset:0;background:radial-gradient(ellipse 45% 60% at 50% 70%,rgba(255,240,200,.22),transparent 70%)}
.curtain{position:absolute;top:0;bottom:0;width:51%;z-index:6;background:repeating-linear-gradient(90deg,#881337 0 34px,#be123c 34px 60px,#9f1239 60px 80px);box-shadow:inset 0 -40px 60px rgba(0,0,0,.4);transition:transform 1.4s cubic-bezier(.7,0,.25,1)}
.curtain.l{left:0;border-right:4px solid #fbbf24}.curtain.r{right:0;border-left:4px solid #fbbf24}
.show.open .curtain.l{transform:translateX(-100%)}.show.open .curtain.r{transform:translateX(100%)}
.ctrl{position:absolute;left:0;right:0;bottom:7%;display:flex;gap:12px;justify-content:center;z-index:8;transition:opacity .4s}.ctrl.hide{opacity:0;pointer-events:none}
.annc{position:absolute;top:13%;left:0;right:0;text-align:center;font-size:clamp(30px,4.4vw,58px);font-weight:900;opacity:0;transform:translateY(-20px);transition:.5s;text-shadow:0 4px 20px rgba(0,0,0,.5)}.annc.on{opacity:1;transform:none}

function Bus(room,onEvent,onStatus){
 const NT=window.NostrTools;if(!NT)return null;
 const sk=NT.generateSecretKey(),pk=NT.getPublicKey(sk),tag="vadv-"+String(room).toLowerCase(),seen=new Set(),socks=[];
 const now=()=>Math.floor(Date.now()/1000);
 function sub(s){try{s.ws.send(JSON.stringify(["REQ","v"+Math.random().toString(36).slice(2,8),{kinds:[NKIND],"#t":[tag],since:now()-30}]));}catch(e){}}
 function open(url,s){
  s=s||{url,ok:false,q:[],tries:0};let ws;try{ws=new WebSocket(url);}catch(e){return s;}s.ws=ws;
  ws.onopen=()=>{s.ok=true;s.tries=0;sub(s);const q=s.q;s.q=[];q.forEach(x=>{try{ws.send(x);}catch(e){}});onStatus&&onStatus();};
  ws.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}
   if(d[0]==="EVENT"&&d[2]){const ev=d[2];if(!ev.id||seen.has(ev.id)||ev.pubkey===pk)return;seen.add(ev.id);if(seen.size>4000)seen.clear();let c;try{c=JSON.parse(ev.content);}catch(_){return;}onEvent(c);}};
  ws.onclose=()=>{const was=s.ok;s.ok=false;if(was)onStatus&&onStatus();s.tries++;setTimeout(()=>open(url,s),Math.min(15000,1500*s.tries));};
  ws.onerror=()=>{};
  return s;
 }
 RELAYS.forEach(u=>socks.push(open(u)));
 return{
  publish(obj){let ev;try{ev=NT.finalizeEvent({kind:NKIND,created_at:now(),tags:[["t",tag]],content:JSON.stringify(obj)},sk);}catch(e){return;}const m=JSON.stringify(["EVENT",ev]);
   socks.forEach(s=>{if(s.ok&&s.ws.readyState===1){try{s.ws.send(m);}catch(e){}}else{s.q.push(m);if(s.q.length>60)s.q.shift();}});},
  up:()=>socks.filter(s=>s.ok).length
 };
}

/* ---------- pretty QR ---------- */
function drawQR(){
 const cv=$("#qrc",lobbyEl||document);if(!cv||!G.code)return;
 loadScript(QR_URLS).then(()=>{
  const qr=window.qrcode(0,"H");qr.addData(joinURL());qr.make();{const nn=qr.getModuleCount(),mat=[];for(let r=0;r<nn;r++){const row=[];for(let k=0;k<nn;k++)row.push(qr.isDark(r,k));mat.push(row);}G.qrMatrix=mat;if(fx)fx.setQR(mat,true);const qb=lobbyEl&&$("#qbtn",lobbyEl);if(qb){qb.disabled=false;qb.textContent="Show the QR";}}
  const n=qr.getModuleCount(),S=600,pad=44,c=(S-2*pad)/n;
  cv.width=S;cv.height=S;const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,S,S);
  const gr=x.createLinearGradient(0,0,S,S);gr.addColorStop(0,"#14532d");gr.addColorStop(.55,"#166534");gr.addColorStop(1,"#15803d");
  const fin=(r,k)=>(r<7&&k<7)||(r<7&&k>=n-7)||(r>=n-7&&k<7);
  const mid=(n-1)/2,lr=n*0.13;
  x.fillStyle=gr;
  for(let r=0;r<n;r++)for(let k=0;k<n;k++){
   if(!qr.isDark(r,k)||fin(r,k))continue;
   x.beginPath();x.arc(pad+(k+.5)*c,pad+(r+.5)*c,c*0.5,0,7);x.fill();
  }
  const rr=(X,Y,W,H,R)=>{x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.closePath();};
  [[0,0],[0,n-7],[n-7,0]].forEach(([r,k])=>{
   const X=pad+k*c,Y=pad+r*c;
   x.fillStyle=gr;rr(X,Y,7*c,7*c,c*2.2);x.fill();
   x.fillStyle="#fff";rr(X+c,Y+c,5*c,5*c,c*1.6);x.fill();
   x.fillStyle="#14532d";rr(X+2*c,Y+2*c,3*c,3*c,c*1.1);x.fill();
  });
 }).catch(()=>{});
}

}

function optTile(j,txt,extra=""){return `<div class="opt ${extra}" style="background:${OPT[j].c}"><span class="sh">${OPT[j].s}</span><span>${esc(txt)}</span>`;}
function pdots(p){return `<div class="pdots">${G.QS.map((_,i)=>{const a=p.ans[i];let c="";if(i<=G.qi&&G.phase!=="question"||i<G.qi){c=a?(a.ok?"y":"n"):"s";}return `<i class="${c}"></i>`;}).join("")}</div>`;}
function board(list){return `<div class="board">${list.map((p,i)=>`<div class="row"><div class="rk">${i+1}</div><div class="nm"><span class="av">${p.av||""}</span>${esc(p.name)}</div><div class="sc">${fmt(p.score)}</div></div>`).join("")}</div>`;}

function renderGame(){
 foot.style.display="none";
 renderPreview();
 if(G.phase==="lobby"){stage.className="wide";mountLobby();return;}
 if(fx)fx.pause();
 stage.className="wide";
 const q=G.QS[G.qi],endB=`<button class="btn ${G.endArm?"endarm":"ghost"}" data-act="gend">${G.endArm?"Tap again to end":"End game"}</button>`,head=`<div class="hqtop"><span class="tag" style="--c:${CAT[q.c]};font-size:15px">${q.c}</span><span class="qn">Question ${G.qi+1} of ${G.QS.length}</span>`;
 if(G.phase==="intro"){
  stage.innerHTML=`<div class="hq">${head}<span class="qn" style="margin-left:auto">${q.t||20} seconds</span>${endB}</div>
  <div class="introbox">${picBox(q,"big")}<h2 class="qtext">${esc(q.q)}</h2><div class="ready">Get ready...</div><div class="tbar"><i id="ibar" style="width:0%"></i></div></div></div>`;
 }else if(G.phase==="question"){
  const rem=Math.max(0,G.dur-(Date.now()-G.qStart)/1000),on=online();
  const done=on.filter(p=>p.ans[G.qi]).length;
  stage.innerHTML=`<div class="hq">${head}<button class="btn ghost" style="margin-left:auto" data-act="greveal">Skip</button>${endB}</div>
  <h2 class="qbar">${esc(q.q)}</h2>
  <div class="mid"><div class="ring" id="ring" style="--p:${rem/G.dur*100}"><span id="tm">${Math.ceil(rem)}</span></div>${picBox(q)}<div class="acount"><b>${done}</b><span>of ${on.length}<br>answers</span></div></div>
  <div class="opts">${G.perm.map((k,j)=>optTile(j,q.o[k])+"</div>").join("")}</div>
  <div class="who" style="margin-top:12px">${on.map(p=>`<span class="${p.ans[G.qi]?"done":""}">${p.av||""} ${esc(p.name)}</span>`).join("")}</div></div>`;
 }else if(G.phase==="reveal"){
  const cnt=G.perm.map(()=>0);G.players.forEach(p=>{const a=p.ans[G.qi];if(a)cnt[a.ch]++;});
  const ci=G.perm.indexOf(q.a),r=ranking(),mx=Math.max(1,...cnt);
  stage.innerHTML=`<div class="hq">${head}<button class="btn rose" style="margin-left:auto" data-act="gnextq">${G.qi+1<G.QS.length?"Next question":"Final results"}</button>${endB}</div>
  <h2 class="qbar">${esc(q.q)}</h2>
  <div class="bars">${cnt.map((c,j)=>`<div class="bcol ${j===ci?"":"dim"}"><div class="bnum">${c}${j===ci?" ✓":""}</div><div class="bfill" style="height:${8+c/mx*120}px;background:${OPT[j].c}"></div><div class="bsh" style="background:${OPT[j].c}">${OPT[j].s}</div></div>`).join("")}</div>
  <div class="opts">${G.perm.map((k,j)=>optTile(j,q.o[k],j===ci?"right":"dim")+"</div>").join("")}</div>
  <div class="expl">${esc(q.e)}</div>
  <h3 style="margin:10px 0 6px">Top 5</h3>${board(r.slice(0,5))}</div>`;
 }else if(G.phase==="final"){
  const r=ranking(),top=r.slice(0,3);
  const order=[1,0,2].filter(i=>top[i]),hs=[210,150,110],cs=["#d89e00","#9ca3af","#b45309"];
  stage.innerHTML=`<div class="hq"><h1 style="text-align:center">Final results</h1>
  <div class="podium">${order.map(i=>`<div class="pod"><div class="pav">${top[i].av||""}</div><div class="pn">${esc(top[i].name)}</div><div class="ps">${fmt(top[i].score)} pts</div><div class="bar" style="height:${hs[i]}px;background:${cs[i]}">${i+1}</div></div>`).join("")}</div>
  ${r.length>3?`<h3 style="margin:10px 0 6px">Top 5</h3>${board(r.slice(0,5))}`:""}<div style="text-align:center;margin-top:20px"><button class="btn ghost" data-act="greset">Back to lobby</button></div></div>`;
 }
}
function renderPreview(){
 let pv=$("#pv");
 if(!G.preview||G.phase!=="lobby"){if(pv)pv.remove();return;}
 if(!pv){pv=document.createElement("div");pv.id="pv";document.body.appendChild(pv);}
 const st=pv.querySelector(".pvbody")?pv.querySelector(".pvbody").scrollTop:0;
 const cats=["Meaning","Usage","Form","Position","Hedging"];
 pv.innerHTML=`<div class="pvhead"><div><b style="font-size:22px">Preview questions</b><div class="note" style="margin:2px 0 0">${G.sel.size} of ${BANK.length} selected · tap a card to add or remove it</div></div>
 <div class="pvtools"><button class="btn ghost" data-act="psel" data-v="all">All</button><button class="btn ghost" data-act="psel" data-v="none">None</button><button class="btn ghost" data-act="psel" data-v="def">Quick 15</button>
 <label class="shuf"><input type="checkbox" data-chg="shuf" ${G.shuf?"checked":""}> Shuffle order</label><button class="btn rose" data-act="pclose">Done</button></div></div>
 <div class="pvbody">${cats.map(c=>`<h3 style="color:${CAT[c]}">${c}</h3><div class="pvgrid">${BANK.map((q,i)=>q.c!==c?"":`<div class="pvc ${G.sel.has(i)?"on":""}" data-act="ptog" data-v="${i}" style="--c:${CAT[c]}"><div class="pvtop"><span class="pvchk">${G.sel.has(i)?"✓":""}</span><span class="pvimg">${q.img}</span><button class="btn ghost swap" data-act="pswap" data-v="${i}" title="Change photo">↻</button><span class="note" style="margin:0 0 0 auto">${q.t}s</span></div>${picBox(q,"mini")}<div class="pvq">${esc(q.q)}</div><div class="pvo">${q.o.map((o,j)=>`<span class="${j===q.a?"ok2":""}"><i style="background:${OPT[j].c}"></i>${esc(o)}</span>`).join("")}</div></div>`).join("")}</div>`).join("")}</div>`;
 const b=pv.querySelector(".pvbody");if(b)b.scrollTop=st;
}

function render(){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===tab));
 if(tab!=="intro"){showClear();songStop();MUS.sfx("tunestop");}
 if(tab==="intro"){if(fx)fx.pause();if(!document.getElementById("show")||!SH0.played)renderIntro();}
 else if(tab==="lesson"){if(fx)fx.pause();renderLesson();}else{initPeer();renderGame();}
 MUS.set(tab!=="game"?"":G.phase==="lobby"?"lobby":(G.phase==="question"||G.phase==="intro")?"question":"");
}

const ACT={
 tab:d=>{tab=d.v;window.scrollTo(0,0);},
 prev:()=>{if(L.i>0)L.i--;},next:()=>{if(L.i<SLIDES.length-1)L.i++;},go:d=>{L.i=+d.v;},
 type:d=>{L.type=d.v;},word:d=>{L.w[L.type]=d.v;},
 spick:d=>{if(L.spick)return;L.spick=d.v;if(d.v===SORT[L.sk][1])L.sscore++;},
 snext:()=>{L.sk++;L.spick=null;},sreset:()=>{L.sk=0;L.sscore=0;L.spick=null;},
 use:d=>{L.use=d.v;},hk:d=>{L.hk=+d.v;L.hc=0;},hc:d=>{L.hc=+d.v;},angle:d=>{L.angle=d.v;},vp:d=>{L.vp=d.v;},
 padv:d=>{L.padv=d.v;},ppos:d=>{L.ppos=d.v;},
 gap:d=>{const g=GAPS[L.gk];if(+d.v===g.ok){L.gdone=true;if(L.gtries===0)L.gscore++;}else{L.gtries++;L.gwrong=+d.v;}},
 gnext:()=>{L.gk++;L.gdone=false;L.gtries=0;L.gwrong=-1;},greset:()=>{L.gk=0;L.gscore=0;L.gdone=false;L.gtries=0;L.gwrong=-1;},
 qrshow:()=>{if(fx&&fx.ready())fx.show();else G.revealedQR=true;},qrhide:()=>{if(fx)fx.hide();else G.revealedQR=false;},
 gstart:()=>{if(!G.sel.size)return;G.preview=false;G.QS=buildQS();G.players.forEach(p=>{p.score=0;p.ans=[];});startQ(0);},
 popen:()=>{G.preview=true;},pswap:d=>{nextPhoto(+d.v);},nsel:d=>{G.sel=+d.v===15?defaultSel():selN(+d.v);},pclose:()=>{G.preview=false;},
 ptog:d=>{const i=+d.v;if(G.sel.has(i))G.sel.delete(i);else G.sel.add(i);},
 psel:d=>{G.sel=d.v==="all"?new Set(BANK.map((_,i)=>i)):d.v==="none"?new Set():defaultSel();},
 gend:()=>{if(G.endArm){endGame();return;}G.endArm=true;render();clearTimeout(G.endT);G.endT=setTimeout(()=>{if(G.endArm){G.endArm=false;if(G.phase!=="final")render();}},3000);},
 mute:()=>{MUS.init();const o=MUS.toggle();const b=$("#mute");if(b)b.textContent=o?"🔊 Music":"🔇 Music";},
 showplay:()=>playShow(),showagain:()=>{renderIntro();playShow();},showedit:()=>{SH0.edit=!SH0.edit;renderIntro();},showreset:()=>{TEAM=JSON.parse(JSON.stringify(TEAM_DEF));saveTeam();renderIntro();},
 greveal:()=>reveal(),gnextq:()=>nextQ(),
};
document.addEventListener("click",e=>{
 MUS.init();
 const b=e.target.closest("[data-act]");if(!b||b.disabled)return;if(b.dataset.act==="pswap")e.stopPropagation();
 const a=b.dataset.act;
 if(a==="greset"&&tab==="game"){resetGame();return;}
 if(ACT[a]){ACT[a](b.dataset);if(a==="pswap"||a==="mute"||a.startsWith("show"))return;if(a!=="greveal"&&a!=="gnextq"&&a!=="gend")render();}
});
document.addEventListener("change",e=>{const c=e.target.dataset.chg;if(c==="shuf"){G.shuf=e.target.checked;}if(c==="tav"){TEAM[+e.target.dataset.i].av=e.target.value;saveTeam();}
 if(c==="stype"){const o=SONG.get();o.type=e.target.value;SONG.set(o);prepSong();renderIntro();}
 if(c==="surl"){const o=SONG.get();o.url=e.target.value.trim();SONG.set(o);ytLoaded="";prepSong();refreshSongUI();}
 if(c==="sstart"){const o=SONG.get();o.start=Math.max(0,+e.target.value||0);SONG.set(o);}
 if(c==="sfile"){const f=e.target.files&&e.target.files[0];if(f){songState="loading";refreshSongUI();idbPut(f).then(()=>{prepSong();});}}});
document.addEventListener("input",e=>{const c=e.target.dataset.chg,i=+e.target.dataset.i;if(c==="tname"){TEAM[i].name=e.target.value;saveTeam();}if(c==="ttag"){TEAM[i].tag=e.target.value;saveTeam();}});
document.addEventListener("keydown",e=>{
 if(tab==="lesson"){if(e.key==="ArrowRight"&&L.i<SLIDES.length-1){L.i++;render();}if(e.key==="ArrowLeft"&&L.i>0){L.i--;render();}}
});
window.__G=G;
render();
}

/* =====================================================================
   PLAYER (phone)
   ===================================================================== */
function startPlayer(room){
 document.body.classList.add("player");
 const app=$("#app");
 let store={};try{store=window.localStorage;}catch(e){store={};}
 const S={view:room?"join":"code",room,name:(store["vadv-name"]||""),av:(AVS.includes(store["vadv-av"])?store["vadv-av"]:AVS[Math.random()*AVS.length|0]),myav:"",err:"",q:null,ends:0,choice:null,rev:null,fin:null,me:""};
 const pidKey="vadv-pid-"+room;
 let pid=store[pidKey];if(!pid){pid="p"+Math.random().toString(36).slice(2,10);try{store[pidKey]=pid;}catch(e){}}
 let peer=null,conn=null,tmr=null,joinTimer=null,bus=null,joinLoop=null,hbT=null,joined=false;
 const direct=()=>!!(conn&&conn.open);
 function toHost(m){m=Object.assign({pid},m);if(direct()){try{conn.send(m);}catch(e){}}if(!direct()||m.t==="join"){if(bus)bus.publish({d:"p2h",pid,m});}}
 function connect(){
  S.view="connecting";joined=false;render();
  clearTimeout(joinTimer);joinTimer=setTimeout(()=>{if(S.view==="connecting"){S.view="error";S.err="Could not reach the game. Check the room code. If it still fails, try mobile data.";render();}},25000);
  const join=()=>toHost({t:"join",name:S.name,av:S.av});
  if(!bus){bus=Bus(S.room,c=>{if(c&&c.d==="h2p"&&c.b&&Array.isArray(c.b[pid]))c.b[pid].forEach(onData);});}
  join();clearInterval(joinLoop);joinLoop=setInterval(()=>{if(joined)clearInterval(joinLoop);else join();},3000);
  clearInterval(hbT);hbT=setInterval(()=>{if(joined&&!direct()&&bus)bus.publish({d:"p2h",pid,m:{t:"hb",pid}});},15000);
  loadScript(PEER_URLS).then(()=>{
   if(!peer||peer.destroyed){peer=new window.Peer(Object.assign({debug:0},ICE));peer.on("open",open);peer.on("error",()=>{});peer.on("disconnected",()=>{try{peer.reconnect();}catch(e){}});}
   else open();
  }).catch(()=>{});
 }
 function open(){
  try{conn=peer.connect("vadv-"+S.room.toLowerCase(),{reliable:true});}catch(e){return;}
  conn.on("open",()=>toHost({t:"join",name:S.name,av:S.av}));
  conn.on("data",onData);
  conn.on("close",()=>{conn=null;setTimeout(()=>{if(peer&&!peer.destroyed&&!direct())open();},4000);});
  conn.on("error",()=>{});
 }
 function onData(m){
  if(!m||typeof m!=="object")return;
  S.lost=false;
  if(m.t==="joined"){joined=true;clearTimeout(joinTimer);S.me=m.name;S.myav=m.av||S.av;if(S.view==="connecting"||S.view==="error")S.view="wait";}
  else if(m.t==="wait"){S.view="wait";}
  else if(m.t==="intro"){S.intro=m;S.choice=null;S.timeUp=false;S.view="intro";clearInterval(tmr);}
  else if(m.t==="q"){if(!S.q||S.q.qi!==m.qi)S.choice=null;S.q=m;S.ends=Date.now()+m.remain*1000;S.view="question";clearInterval(tmr);tmr=setInterval(tickP,250);}
  else if(m.t==="reveal"){S.rev=m;S.view="reveal";clearInterval(tmr);}
  else if(m.t==="final"){S.fin=m;S.view="final";clearInterval(tmr);}
  render();
 }
 function tickP(){const r=Math.max(0,Math.ceil((S.ends-Date.now())/1000));const el=$("#ptm");if(el)el.textContent=r+"s";if(r<=0&&S.choice===null){S.timeUp=true;render();clearInterval(tmr);}}

 function render(){
  let h="";
  const lost=S.lost?`<div class="warn" style="margin-bottom:10px">Reconnecting...</div>`:"";
  if(S.view==="code"){
   h=`<div class="pcard"><div class="brand" style="justify-content:center"><i></i>Viewpoint Adverbs</div><input id="rc" placeholder="Room code" maxlength="5" autocapitalize="characters" value="${esc(S.room)}"><button class="btn rose" data-p="code" style="width:100%">Next</button></div>`;
  }else if(S.view==="join"){
   h=`<div class="pcard"><div class="brand" style="justify-content:center"><i></i>Viewpoint Adverbs</div><p style="color:var(--mut)">Room <b>${esc(S.room)}</b></p><input id="nm" placeholder="Your name" maxlength="16" value="${esc(S.name)}"><div class="avlab">Choose your avatar</div><div class="avgrid">${AVS.map(a=>`<button class="${a===S.av?"on":""}" data-p="av" data-v="${a}">${a}</button>`).join("")}</div><button class="btn rose" data-p="join" style="width:100%;font-size:19px">Join the game</button></div>`;
  }else if(S.view==="connecting"){
   h=`<div class="pcard"><div class="spin"></div><b>Joining room ${esc(S.room)}...</b></div>`;
  }else if(S.view==="error"){
   h=`<div class="pcard"><div class="big-ico">🌸</div><p>${esc(S.err)}</p><button class="btn" data-p="retry">Try again</button></div>`;
  }else if(S.view==="wait"){
   h=`<div class="pcard"><div class="big-ico bounce">${S.myav||S.av}</div><h2 style="margin:6px 0">You're in, ${esc(S.me)}!</h2><p style="color:var(--mut)">Look at the screen. The game starts soon.</p><div class="spin"></div></div>`;
  }else if(S.view==="intro"){
   const q=S.intro;h=`<div class="ptop"><span>${q.qi+1} / ${q.n}</span><span class="tag" style="--c:${CAT[q.cat]}">${q.cat}</span><span></span></div><div class="pcard"><div class="big-ico">👀</div><h2 style="margin:4px 0">Get ready!</h2><p class="pq">${esc(q.text)}</p><div class="spin"></div></div>`;
  }else if(S.view==="question"){
   const q=S.q,picked=S.choice!==null;
   h=`<div class="ptop"><span>${q.qi+1} / ${q.n}</span><span class="tag" style="--c:${CAT[q.cat]}">${q.cat}</span><span class="ptm" id="ptm">${Math.max(0,Math.ceil((S.ends-Date.now())/1000))}s</span></div>
   <div class="pq">${esc(q.text)}</div>
   <div class="popts">${q.opts.map((o,j)=>`<button style="background:${OPT[j].c}" class="${picked?(S.choice===j?"pick":"faded"):""}" data-p="ans" data-v="${j}" ${picked||S.timeUp?"disabled":""}><span style="font-size:24px">${OPT[j].s}</span><span>${esc(o)}</span></button>`).join("")}</div>
   ${picked?`<p style="text-align:center;font-weight:800;color:var(--plum)">Answer sent. Wait for the others...</p>`:S.timeUp?`<p style="text-align:center;font-weight:800">Time's up!</p>`:""}`;
  }else if(S.view==="reveal"){
   const r=S.rev;
   h=`<div class="pcard" style="border-top:8px solid ${r.ok?"#16a34a":"#e21b3c"}"><div class="big-ico">${r.ok?"✅":r.answered?"❌":"⏰"}</div>
   <h2 style="margin:4px 0">${r.ok?"Correct!":r.answered?"Not quite":"No answer"}</h2>
   ${r.ok?`<div class="pts">+${fmt(r.pts)}</div>`:`<p>Correct answer: <b>${esc(r.answer)}</b></p>`}
   <p style="color:var(--mut)">${esc(r.expl)}</p>
   <p style="font-size:18px">${S.myav||""} You are <b>${ord(r.rank)}</b> of ${r.total} · <b>${fmt(r.score)}</b> pts</p></div>`;
  }else if(S.view==="final"){
   const f=S.fin;
   h=`<div class="pcard"><div class="big-ico">${S.myav||""}${f.rank===1?"🏆":f.rank<=3?"🥈":"🎉"}</div><h2 style="margin:4px 0">You finished ${ord(f.rank)} of ${f.total}</h2>
   <div class="pts">${fmt(f.score)} pts</div><p>${f.correct} / ${f.n} correct</p>
   <div style="margin-top:10px">${Object.keys(f.cats).map(c=>{const [a,t]=f.cats[c];return `<div class="catbar"><span style="color:${CAT[c]}">${c}</span><div class="tr"><i style="width:${t?a/t*100:0}%;background:${CAT[c]}"></i></div><span>${a}/${t}</span></div>`;}).join("")}</div>
   <p style="color:var(--mut);margin-top:12px">Top 3: ${f.top.map((t,i)=>`${i+1}. ${esc(t.name)}`).join(" · ")}</p></div>`;
  }
  app.innerHTML=`<div class="pw">${lost}${h}</div>`;
 }
 app.addEventListener("click",e=>{
  const b=e.target.closest("[data-p]");if(!b||b.disabled)return;
  const a=b.dataset.p;
  if(a==="code"){const v=($("#rc").value||"").trim().toUpperCase();if(v.length<4)return;S.room=v;S.view="join";render();}
  else if(a==="av"){const nm=$("#nm");if(nm)S.name=nm.value;S.av=b.dataset.v;try{store["vadv-av"]=S.av;}catch(e){}render();}
  else if(a==="join"){const v=($("#nm").value||"").trim();if(!v){$("#nm").focus();return;}S.name=v;try{store["vadv-name"]=v;}catch(e){}connect();}
  else if(a==="retry"){S.view="join";render();}
  else if(a==="ans"){if(S.choice!==null)return;S.choice=+b.dataset.v;toHost({t:"answer",qi:S.q.qi,choice:S.choice});render();}
 });
 app.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=$("[data-p='join'],[data-p='code']");if(b)b.click();}});
 render();
}
})();
</script>
