<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="B2.1 Lab"><meta name="theme-color" content="#16213A"></head><body><title>B2.1 Study Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: a white study sheet like the C1.1 labs. Sticky tab bar, unit pills, then one working card at a time. Single light theme on purpose: it reads like paper. Units and parts of speech each own a colour. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F6F7F9; --ink:#16213A; --muted:#5B6579; --line:#DDE1E8;
  --mark:#F4D63C; --mark-ink:#16213A; --good:#1F8A5B; --bad:#C23B2E; --goodbg:#EEF7F1; --badbg:#FBEDEB;
  --n:#2F68C9; --v:#C2452F; --a:#1F8A5B; --d:#8A4FC9;
  --u1:#D9480F; --u2:#1F5FBF; --u3:#B0186E; --u4:#6A3FD1; --u5:#0B867E; --u6:#B86E00;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ipa:"Noto Sans","Charis SIL","Lucida Sans Unicode","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(1.8rem,5vw,2.5rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.sub{color:var(--muted);max-width:64ch}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--n)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.N{color:var(--n)} .V{color:var(--v)} .A{color:var(--a)} .D{color:var(--d)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:grid;min-width:110px}
.stat b{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:2px 0;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;padding:10px 12px;font-family:var(--display);font-weight:700;font-size:1rem;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--mark)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.st{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:.88rem;font-weight:700;color:var(--muted)}
.st[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.stage{display:grid;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3.5vw,26px);display:grid;gap:14px;min-width:0}
.soft{background:var(--soft)}
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--ink);color:#fff}
.btn.small{padding:5px 11px;font-size:.88rem;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:default}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:.85rem;color:var(--muted);white-space:nowrap}
.icon.say{color:var(--ink);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.feedback{font-weight:700;min-height:1.4em}
.ok{color:var(--good)} .ko{color:var(--bad)}
.clue{background:#FDF6D3;border-radius:10px;padding:10px 14px;max-width:70ch}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:8px 12px;max-width:100%}
textarea{width:100%;min-height:260px;line-height:1.6;resize:vertical;font-family:var(--serif);font-size:1.05rem}
.ipa{font-family:var(--ipa);color:var(--muted);font-size:.92rem}
.uu1{--uc:var(--u1)} .uu2{--uc:var(--u2)} .uu3{--uc:var(--u3)} .uu4{--uc:var(--u4)} .uu5{--uc:var(--u5)} .uu6{--uc:var(--u6)} .uu0{--uc:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.upill{border:2px solid var(--uc);color:var(--uc);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700}
.upill[aria-pressed="true"]{background:var(--uc);color:#fff}
.ulabel{color:var(--uc);font-weight:700}
.ubar{border-left:5px solid var(--uc)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px}
/* word list */
.wl{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 14px;border:1px solid var(--line);border-left:5px solid var(--uc);border-radius:10px;align-items:start}
.wrow .w{font-family:var(--display);font-weight:700;font-size:1.1rem}
.wrow .def{grid-column:1/-1}
.wrow .ex{grid-column:1/-1;color:var(--muted);font-style:italic}
.lv{display:flex;gap:4px;flex-wrap:wrap;grid-column:1/-1}
.lvb{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;font-size:.75rem;padding:2px 9px;color:var(--muted);font-weight:700}
.lvb[aria-pressed="true"].l0{background:#E9ECF1;color:var(--ink);border-color:#C9CFD8}
.lvb[aria-pressed="true"].l1{background:#FDF0C2;color:#6B5200;border-color:#E9CE62}
.lvb[aria-pressed="true"].l2{background:#DCEBFB;color:#174C8C;border-color:#8DB5E6}
.lvb[aria-pressed="true"].l3{background:var(--goodbg);color:var(--good);border-color:#8CC9A7}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.lvcount{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-variant-numeric:tabular-nums}
/* flashcard */
.flash{min-height:230px;border:2px solid var(--uc);border-radius:16px;display:grid;place-items:center;text-align:center;padding:24px;background:var(--surface);cursor:pointer;gap:10px}
.flash .big{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.4rem);font-weight:800;color:var(--uc)}
/* options */
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px}
.opt:hover{border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.why{font-size:.92rem;color:var(--ink);background:var(--soft);border-radius:8px;padding:8px 12px}
/* match race */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.mc{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;font-size:.9rem;min-width:0}
.mc.sel{border-color:var(--mark);background:#FDF6D3}
.mc.done{opacity:.35;border-style:dashed}
/* families (POS boxes like the C1.1 lab) */
.famhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.famhead .key{font-family:var(--display);font-weight:800;font-size:clamp(2rem,7vw,3rem);letter-spacing:.01em;line-height:1}
.mean{font-size:1.1rem;max-width:68ch}
.pbox{border:2.5px solid var(--pc);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start;background:var(--surface);text-align:left;min-height:96px}
.pbox .lab{color:var(--pc);font-weight:700}
.pbox .w{font-family:var(--display);font-weight:700;font-size:1.25rem}
.pbox.none{border-style:dashed;opacity:.75}
.pbox .tools{display:flex;flex-wrap:wrap;gap:6px}
.pbox .tools a,.pbox .tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 9px;font-size:.82rem;color:var(--muted);text-decoration:none}
.pN{--pc:var(--n)} .pV{--pc:var(--v)} .pA{--pc:var(--a)} .pD{--pc:var(--d)} .pO{--pc:var(--muted)}
.slot{cursor:pointer}
.slot.filled{background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:700;font-size:1.02rem}
.chip.sel{background:var(--mark)}
.chip.used{opacity:.3;text-decoration:line-through}
.sent{font-family:var(--serif);font-size:1.2rem;line-height:1.7;max-width:62ch}
.blank{display:inline-block;min-width:5em;border-bottom:2px solid var(--ink)}
.capkey{font-weight:800;letter-spacing:.08em;border:2px solid var(--ink);border-radius:6px;padding:1px 8px}
.posbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.posbtn{border:2.5px solid var(--pc);color:var(--pc);background:var(--surface);border-radius:12px;padding:12px;font-family:var(--display);font-weight:800;font-size:1.05rem}
.posbtn.right{background:var(--pc);color:#fff}
.posbtn.wrong{opacity:.35}
/* how-to strip */
.how{display:grid;gap:8px;counter-reset:p;list-style:none;padding:12px 14px;margin:0;background:#FFFBEA;border:1px solid #EFE2A8;border-radius:12px}
.how li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.how li::before{counter-increment:p;content:counter(p);width:24px;height:24px;border-radius:50%;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.tile{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.tile:hover{border-color:var(--ink)}
.tile b{font-family:var(--display);font-size:1.15rem}
.tile span{color:var(--muted);font-size:.92rem}
.linkcard{display:grid;gap:2px;border:1px solid var(--line);border-left:5px solid var(--uc);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.linkcard small{color:var(--muted)}
/* icons, progress, games, intonation */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.ic.big{width:64px;height:64px}
.tab{display:inline-flex;gap:6px;align-items:center}
.tab .ic{opacity:.7}.tab[aria-selected="true"] .ic{opacity:1;color:var(--v)}
.tile{position:relative}
.tileic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#FDF0B5;color:var(--ink);font-size:1.3rem;margin-bottom:4px}
.tile:nth-child(2) .tileic{background:#DCEBFB}.tile:nth-child(3) .tileic{background:#F9E3DE}.tile:nth-child(4) .tileic{background:#E1F2E8}.tile:nth-child(5) .tileic{background:#EEE5FA}.tile:nth-child(6) .tileic{background:#FFE8D6}.tile:nth-child(7) .tileic{background:#DDF3F1}.tile:nth-child(8) .tileic{background:#FCE4EF}
.uprogs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.uprog{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);line-height:1.3}
.uprog small{color:var(--muted)}
.pbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.tbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--mark),var(--good));border-radius:99px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{top:110%;transform:translateX(40px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.gcard{display:flex;gap:14px;text-align:left;border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);align-items:flex-start}
.gcard:hover{border-color:var(--ink)}
.gcard.hl{border-color:var(--mark);box-shadow:0 0 0 3px #FDF0B5}
.gart{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;flex:none;background:#FDF0B5}
.gcard:nth-child(2) .gart{background:#DCEBFB;color:var(--n)}.gcard:nth-child(3) .gart{background:#E1F2E8;color:var(--a)}.gcard:nth-child(4) .gart{background:#EEE5FA;color:var(--d)}.gcard:nth-child(5) .gart{background:#F9E3DE;color:var(--v)}.gcard:nth-child(6) .gart{background:#DDF3F1;color:var(--u5)}
.gtxt{display:grid;gap:3px}.gtxt b{font-family:var(--display);font-size:1.15rem}.gtxt small{color:var(--muted);font-weight:700}.gtxt span{font-size:.92rem}
.opts.two{grid-template-columns:1fr 1fr}
.opt.big{font-size:1.1rem;font-weight:700;padding:14px}
.btn.big{font-size:1.15rem;padding:12px 22px}
.pop{animation:pop .3s}@keyframes pop{50%{transform:scale(1.06)}}
.streak{font-weight:800;color:var(--v)}
.slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lslot{width:38px;height:46px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;font-weight:800;text-transform:lowercase}
.lslot.full{background:#FDF6D3;border-radius:6px 6px 0 0}.lslot.win{background:var(--goodbg);border-color:var(--good)}
.tiles2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ltile{width:46px;height:46px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);font-family:var(--display);font-size:1.3rem;font-weight:800;box-shadow:0 3px 0 var(--ink)}
.ltile:disabled{opacity:.2;box-shadow:none}
.bline{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bline.winline{border-color:var(--good);background:var(--goodbg)}
.wtile{border:2px solid var(--ink);border-radius:8px;background:var(--surface);padding:6px 10px;font-weight:700;box-shadow:0 2px 0 var(--ink)}
.wtile.on{background:#FDF6D3}.wtile:disabled{opacity:.2;box-shadow:none}
.sortword{font-family:var(--display);font-size:clamp(2rem,9vw,3rem);font-weight:800;text-align:center;display:grid;line-height:1.1;padding:10px}
.sortword small{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.08em}
.isent{display:flex;flex-wrap:wrap;gap:6px 0;align-items:flex-start;padding-top:6px}
.iw{position:relative;display:grid;justify-items:center;padding:0 6px;min-width:34px;border-radius:8px}
.icurve{width:calc(100% + 12px);margin:0 -6px;height:46px;overflow:visible}
.icurve path{fill:none;stroke:var(--v);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linecap:round}
.idot{position:absolute;left:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--v)}
.iword{font-family:var(--serif);font-size:1.2rem;line-height:1.3;white-space:nowrap}
.iw.str .iword{font-weight:700}
.iw.nuc .iword{font-weight:700;background:#FDF0B5;padding:0 3px;border-radius:4px}
.ilink{color:var(--v);font-weight:700}
.iipa{font-family:var(--ipa);color:var(--n);font-size:.92rem;white-space:nowrap}
.ibar{font-size:1.6rem;color:var(--muted);align-self:center;padding:30px 4px 0}
.iw.pickable{cursor:pointer;border:2px solid transparent}
.iw.pickable:hover{border-color:var(--line)}
.iw.picked{background:#FDF0B5}
.iw.good{background:var(--goodbg)}.iw.miss{background:#FFE8D6}.iw.extra{background:var(--badbg)}
.iline{font-family:var(--ipa);font-size:1.25rem;color:var(--n);line-height:1.8}
@media (max-width:560px){.opts.two{grid-template-columns:1fr}.tab span{font-size:.92rem}}
.camgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.camsc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;align-content:start}
.camnum{font-family:var(--display);font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:grid;grid-template-columns:1.2em 1fr;gap:6px;font-size:.93rem}
.checks li>span{font-weight:800}
.checks li small{color:var(--muted)}
.crow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.cph{font-family:var(--display);font-size:1.12rem}
.forkhub{font-family:var(--display);font-weight:800;font-size:clamp(1.8rem,7vw,2.6rem);color:var(--uc);border:3px solid var(--uc);border-radius:999px;padding:6px 26px}
.forkopts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fopt{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:1.02rem}
.fopt.on{border-color:var(--ink);background:#FDF0B5}
.fopt.good{border-color:var(--good);background:var(--goodbg);color:var(--good)}
.fopt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad);text-decoration:line-through}
.fopt.miss{opacity:.45}
.wrongword{background:var(--badbg);border-bottom:2px solid var(--bad);padding:0 4px;font-weight:700}
/* families */
.famgrid{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1.5px solid var(--line);border-left:5px solid var(--uc);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center;font-weight:700}
.fchip .tick{font-size:.75rem;color:var(--good);width:.9em}
.fchip.cur{box-shadow:0 0 0 2px var(--mark)}
.letter{font-family:var(--display);font-weight:800;color:var(--muted);width:100%;font-size:.8rem;letter-spacing:.1em;margin-top:6px}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fcell{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:4px;background:var(--soft)}
.fcell b{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em}
.fcell input{width:100%}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.stepb{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.88rem}
.stepb[aria-current="step"]{border-color:var(--ink);background:var(--mark)}
/* grammar */
.formula{font-family:var(--serif);font-size:1.02rem;padding:8px 12px;border-left:3px solid var(--mark);background:var(--soft);border-radius:0 8px 8px 0}
.formula b{background:#FDF0B5;font-weight:600;padding:0 2px}
.mist s{color:var(--bad)}
.topic{text-align:left;border:1px solid var(--line);border-left:5px solid var(--uc);background:var(--surface);border-radius:10px;padding:10px 14px;display:grid;gap:2px}
.topic small{color:var(--muted)}
/* exam paper */
.paper{font-family:var(--serif);font-size:1.05rem;line-height:1.85;max-width:72ch}
.gap{display:inline-block;min-width:2.2em;border-bottom:2px solid var(--ink);text-align:center;font-family:var(--body);font-weight:700;padding:0 4px;line-height:1.4}
.gnum{font-family:var(--body);font-size:.75rem;font-weight:700;background:var(--ink);color:#fff;border-radius:4px;padding:0 5px;margin-right:2px}
.qrow{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.abcd{display:flex;flex-wrap:wrap;gap:6px}
.ab{border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:.92rem}
.ab[aria-pressed="true"]{border-color:var(--ink);background:var(--mark)}
.ab.right{border-color:var(--good);background:var(--goodbg)}
.ab.wrong{border-color:var(--bad);background:var(--badbg)}
.gin{font:inherit;font-family:var(--body);width:9em;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:0 4px;background:#FFFBEA}
.gin.right{background:var(--goodbg);border-color:var(--good)}
.gin.wrong{background:var(--badbg);border-color:var(--bad)}
.kwt{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.kwt .key{font-weight:800;letter-spacing:.08em}
.bank{display:flex;flex-wrap:wrap;gap:6px;border:2px dashed var(--line);border-radius:10px;padding:10px}
.bank span{font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft)}
.bank span.used{text-decoration:line-through;opacity:.4}
.textbox{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.textbox b{font-family:var(--display)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--soft)}
.score{font-family:var(--display);font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums}
.timer{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;padding:4px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:#FDF6D3}
.transcript p{margin-bottom:6px}
/* writing */
.fb li{margin-bottom:6px}
.mark-err{background:var(--badbg);border-bottom:2px solid var(--bad)}
.notes{display:flex;flex-wrap:wrap;gap:6px}
.notes span{border:1.5px solid var(--line);border-radius:6px;padding:2px 8px;font-size:.9rem}
.model{white-space:pre-wrap;font-family:var(--serif);font-size:1.02rem;line-height:1.7;max-width:70ch}
.wc{font-variant-numeric:tabular-nums;font-weight:700}
/* sounds */
.ipagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.ipacell{border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;background:var(--surface);display:grid;gap:2px}
.ipacell b{font-family:var(--ipa);font-size:1.35rem;font-weight:600}
.ipacell span{font-size:.75rem;color:var(--muted)}
.ipacell:hover{border-color:var(--ink)}
.syl{font-family:var(--ipa);font-size:1.3rem}
/* games */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.team{border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.team.on{border-color:var(--ink);background:#FDF6D3}
.team b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.bigq{font-family:var(--display);font-size:clamp(1.3rem,4.5vw,1.9rem);font-weight:700;line-height:1.25}
.describe{font-family:var(--display);font-size:clamp(2rem,9vw,3.4rem);font-weight:800;text-align:center;color:var(--uc)}
.ai{border:1.5px dashed var(--n);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
@media (max-width:560px){.match{grid-template-columns:1fr 1.3fr}.tab{padding:8px 8px;font-size:.9rem}}

["Every Sunday my grandfather ___ us to the park.",["would take","was taking","is taking"],0,"would is fine for repeated past actions."],
["After two years in Chile, I'm used to ___ dinner late.",["have","having","had"],1,"be used to + -ing = it is familiar now."],
["She ___ her sister's clothes without asking. It was so annoying.",["was always borrowing","always borrows","would always borrowed"],0,"always + past continuous for annoying past habits."],
["Sometimes my dad ___ for hours about politics.",["will talk","is talk","used talk"],0,"will + base form can describe typical present behaviour."]]},
{id:"it",unit:1,lesson:"Unit 1 Lesson 5",title:"Introductory it",
what:"We often start a sentence with it and put the real subject (a clause) later. This sounds more natural than starting with a long clause.",
form:["It + verb + that + clause: <b>It seems that</b> you have settled in.","It + be + not + that + clause: <b>It is not that</b> Mark is rude.","It + be + just + that + clause: <b>It's just that</b> he doesn't know the phrase.","It + verb + like / as if / as though: <b>It seems as if</b> I've lived here for years.","It + verb + person + (that) + clause: <b>It surprises me</b> that you feel this way.","It + verb + person + infinitive: <b>It worries me to see</b> that he's unhappy.","It + verb + adjective + infinitive: <b>It is easy to learn</b> English."],
uses:[["Appearance","It appears that the meeting has been cancelled."],["Feelings","It amazes me how fast children learn languages."],["Instead of a long subject","It is important to respect local customs. (not: To respect local customs is important.)"]],
mistakes:["<s>Is important to arrive on time.</s> It is important to arrive on time.","<s>To learn English is easy.</s> It is easy to learn English.","<s>It seems like he is feel tired.</s> It seems as if he is tired."],
practice:[
["___ that the new manager is very strict.",["It seems","Seems","This seems"],0,"English needs a subject: it."],
["It ___ me that people still believe fake news.",["surprises","surprised to","is surprise"],0,"It + verb + person + that."],
["It is difficult ___ the local accent at first.",["understanding","to understand","understand"],1,"It + be + adjective + infinitive."],
["It's not ___ I don't like you. I'm just tired.",["because","that","what"],1,"It + be + not + that + clause."],
["It felt ___ I had lived there all my life.",["as if","that","like as"],0,"It + feel + as if + clause."],
["It occurred ___ that he might be suffering from culture shock.",["for him","to him","him"],1,"occur to + person."]]},
{id:"questions",unit:2,lesson:"Unit 2 Lesson 2",title:"Question forms",
what:"Questions with an auxiliary use inversion (auxiliary before subject). Subject questions, questions with prepositions, question tags and indirect questions follow special rules.",
form:["Direct: auxiliary + subject + main verb: <b>Where did</b> the carjacker <b>leave</b> the vehicle?","Subject question (no do): <b>Who threw</b> the brick?","Object question (with do): <b>What did</b> the vandal <b>throw</b>?","Preposition at the end: <b>Who</b> did the detective work <b>with</b>?","Formal: <b>With whom</b> did the detective work?","Question tag: positive statement + negative tag: It's a serious crime, <b>isn't it</b>?","Indirect: question phrase + subject + verb: Do you know <b>who spray-painted</b> the wall?"],
uses:[["Asking for information (tag with rising intonation)","You saw the robbers drive away, didn't you? ↗"],["Asking for agreement (falling intonation)","Robbery is a serious crime, isn't it? ↘"],["Polite indirect question","Could you tell me where the police station is?"],["I wonder if... (no question mark)","I wonder if the robber will go to jail."]],
mistakes:["<s>Who did steal the car?</s> Who stole the car? (subject question)","<s>Do you know where is the station?</s> Do you know where the station is?","<s>Can you tell me how could I reduce stress?</s> Can you tell me how I could reduce stress?"],
practice:[
["Who ___ the window?",["did break","broke","breaks did"],1,"Subject question: no auxiliary do."],
["What ___ the witness see?",["did","was","has"],0,"Object question: we need the auxiliary did."],
["Do you know where ___?",["is the court","the court is","does the court"],1,"Indirect questions use normal word order: subject + verb."],
["She didn't call the police, ___?",["didn't she","did she","does she"],1,"Negative statement + positive tag."],
["Who did you go to the trial ___?",["with","whom","to"],0,"The preposition goes at the end in informal questions."],
["I wonder ___ the suspect will confess.",["if","does","that if"],0,"I wonder if + statement order, no question mark."],
["Could you tell me ___?",["how could I reduce stress","how I could reduce stress","how reduce I stress"],1,"Indirect question: subject before could."]]},
{id:"modals",unit:2,lesson:"Unit 2 Lesson 5",title:"Modals of obligation",
what:"Modals and similar phrases show obligation, lack of obligation, advice and permission. Be careful: the negatives do not all mean the same.",
form:["Strong obligation: <b>must / have to / need to</b> + base form","No obligation: <b>don't have to / don't need to / needn't</b>","Prohibition: <b>mustn't / can't / not allowed to / not permitted to</b>","Advice: <b>should / ought to</b> (negative: shouldn't / ought not to)","Permission: <b>can / be allowed to / be permitted to</b>","Formal strong obligation: <b>be obliged to / be obligated to</b>","Past: <b>had to</b> (there is no past form of must)"],
uses:[["Rule","You must wear a seat belt when driving."],["Not necessary","Witnesses don't have to give their names."],["Forbidden","Shop owners mustn't leave windows open at night."],["Advice","You ought to call the police next time."],["Formal rule","Residents are obliged to report any suspicious activity."]],
mistakes:["<s>You must to pay the fine.</s> You must pay the fine.","<s>Yesterday I must work late.</s> Yesterday I had to work late.","<s>You mustn't bring ID</s> (if it's optional): You don't have to bring ID."],
practice:[
["Students ___ use their phones during the exam. It's forbidden.",["don't have to","mustn't","needn't"],1,"Prohibition: mustn't."],
["You ___ bring food. Lunch is included.",["mustn't","don't have to","aren't allowed"],1,"No obligation: don't have to."],
["Last year he ___ pay a fine for speeding.",["must","had to","has to"],1,"Past obligation: had to."],
["You ___ install a security system. It's a good idea.",["should","must not","are obliged"],0,"Advice: should."],
["Inmates ___ to book the meeting room for an hour.",["can","are allowed","must"],1,"be allowed to + base form."],
["Residents are obliged ___ any suspicious activity.",["report","to report","reporting"],1,"be obliged to + base form."]]},
{id:"comparisons",unit:3,lesson:"Unit 3 Lesson 2",title:"Making and modifying comparisons",
what:"We compare two things with comparative adjectives and adverbs, and we can make the difference bigger, smaller or equal with modifiers.",
form:["One syllable: + -er (longer); -y: happier; 2+ syllables: more + adj","Big difference: <b>far / much / a lot</b> + comparative","Small difference: <b>a little / a bit / slightly / not much</b> + comparative","Equal: <b>as + adj + as</b>; not equal: <b>not as + adj + as</b>","Almost equal: <b>almost / nearly / not quite</b> as ... as; far from equal: <b>nowhere near as</b> ... as","The + comparative, the + comparative: <b>The harder</b> I work, <b>the more stressed</b> I feel.","Superlative: the + -est / the most + adj"],
uses:[["Big difference","Solar panels are far cheaper than they were ten years ago."],["Small difference","The number of participants was slightly lower than expected."],["Equal","She's just as good at maths as I am."],["Not even close","That shop is nowhere near as cheap as I'd expected."]],
mistakes:["<s>more better</s> much better","<s>She is more tall than me.</s> She is taller than me.","<s>He is so tall as his father.</s> He is as tall as his father.","<s>The more you practise, the better you will.</s> The more you practise, the better you get."],
practice:[
["This exam is ___ easier than the last one. I finished in 20 minutes!",["far","very","more"],0,"far + comparative for a big difference."],
["The new system is ___ more efficient than the old one, only 2%.",["slightly","much","a lot"],0,"Small difference: slightly."],
["My brother is ___ tall as my father.",["as","so","more"],0,"as + adjective + as."],
["The ___ you practise, the more confident you become.",["much","more","most"],1,"The + comparative, the + comparative."],
["Quito is nowhere ___ as hot as Guayaquil.",["near","close","far"],0,"Fixed phrase: nowhere near as ... as."],
["It was the ___ day of my life.",["happier","most happy","happiest"],2,"Two syllables ending in -y: the + -iest."]]},
{id:"nounclauses",unit:3,lesson:"Unit 3 Lesson 6",title:"Noun clauses",
what:"A noun clause is a group of words that works like a noun: it can be the subject, the object or come after a linking verb. It cannot stand alone as a sentence.",
form:["As subject: <b>Whether or not you feel pressure</b> can make the difference.","As object: I don't like <b>the fact that there is pressure to succeed</b>.","After a linking verb (be, seem): The problem is <b>that nobody listens</b>.","With wh- words: I know <b>why that happened</b>. She told me <b>what her parents said</b>.","With -ever words: <b>Whatever you decide</b> is fine with me.","With if / whether: I don't know <b>whether</b> I passed."],
uses:[["Subject","What you're saying makes sense."],["Object","I can't remember where I left my keys."],["After be","The problem is that nobody listens."]],
mistakes:["<s>What you're saying.</s> (not a full sentence) I hear what you're saying.","<s>I don't know what does he want.</s> I don't know what he wants.","<s>Whatever you choose it is fine.</s> Whatever you choose is fine.","<s>The thing what I need is time.</s> What I need is time. (noun clause) / The thing that I need is time. (relative clause)"],
compare:true,
practice:[
["___ you agree with my choice doesn't affect my decision.",["Whether or not","If or not","That"],0,"As a subject we use whether (not if)."],
["I don't know ___.",["what does she want","what she wants","what wants she"],1,"Noun clause = statement word order."],
["The problem is ___ nobody told us.",["that","what","whether that"],0,"After be: that + clause."],
["I'll support ___ you decide.",["whatever","that","which"],0,"whatever you decide is the object of support: a noun clause meaning anything that you decide."],
["She explained ___ the experiment had failed.",["why","that why","what why"],0,"wh- noun clause as object."],
["I wonder ___ they will accept my application.",["whether","what","that"],0,"Yes/no idea: whether / if."]]},
{id:"reported",unit:4,lesson:"Unit 4 Lesson 2",title:"Reported speech",
what:"We report what someone said without their exact words. Tenses usually move one step back, and pronouns and time words change.",
form:["will > would; present simple > past simple; present continuous > past continuous","present perfect > past perfect; past simple > past perfect","say (that) + clause; tell + person + (that) + clause","Questions: ask + (person) + wh-/if + subject + verb: He asked where I was going.","Commands: tell/order/warn + person + (not) to + base form","Reporting verbs: agree/decide/promise/refuse + to; admit/deny/suggest + -ing; apologise for/insist on + -ing","Passive: It is rumoured that... / They are alleged to have..."],
uses:[["Time words","tomorrow > the next day; last night > the night before; here > there"],["Question","'Where is the script?' > He asked where the script was."],["Gerund verb","He denied shouting at his co-star."],["Infinitive verb","My parents agreed to let me go to the concert."]],
mistakes:["<s>He said me that...</s> He told me that... / He said that...","<s>She asked where was the station.</s> She asked where the station was.","<s>He suggested to go.</s> He suggested going."],
practice:[
["'I'll call you,' she said. > She said she ___ call me.",["will","would","had"],1,"will > would."],
["He ___ me that he had lost his job.",["said","told","asked"],1,"tell + person."],
["She asked me where ___.",["was I going","I was going","I am going"],1,"Reported question: statement order, tense back."],
["The actor denied ___ the photographer.",["to push","pushing","push"],1,"deny + -ing."],
["They ordered us ___ filming immediately.",["stop","to stop","stopping"],1,"order + person + to."],
["'The invitation arrived last night.' > He said the invitation had arrived ___.",["last night","the night before","tonight"],1,"last night > the night before."],
["It ___ that the couple have bought a new home.",["is rumoured","rumours","is rumour"],0,"Passive reporting: It is rumoured that..."]]},
{id:"relatives",unit:4,lesson:"Unit 4 Lesson 5",title:"Relative clauses",
what:"A relative clause comes after a noun and gives information about it, like an adjective. Defining clauses identify which one we mean; non-defining clauses add extra information between commas. Do not confuse it with a noun clause, which works as the subject or object of the sentence.",
form:["Pronouns: who (people), which (things), where (places), when (time), whose (possession), that (people/things, defining only)","Defining: The actor <b>who won the award</b> is called Jonathan.","Non-defining: Vogue, <b>which has featured many photos</b>, is famous.","Object of the clause: the pronoun can be left out (defining only): The actor (who) Jonathan interviewed...","Non-defining: no that, never leave out the pronoun, use commas."],
uses:[["Which one?","The house where Kim lives is huge."],["Possession","The celebrity whose brother is also famous."],["Extra info","The year 2012, when I was eleven, was great for cinema."],["Comment on a whole clause","He arrived late, which annoyed everyone."]],
mistakes:["<s>Quito, that is the capital, is high.</s> Quito, which is the capital, is high.","<s>The man which lives here</s> The man who lives here","<s>The film that I saw it was boring.</s> The film that I saw was boring.","<s>Everything what he said was true.</s> Everything that he said was true. (after a noun or everything, use that, not what)"],
compare:true,
practice:[
["The engineer ___ designed the system is from Cuenca.",["who","which","whose"],0,"People: who."],
["My laptop, ___ I bought last year, has already broken.",["that","which","—"],1,"Non-defining: which, not that, and it cannot be omitted."],
["That's the café ___ we first met.",["which","where","when"],1,"Place: where."],
["The singer ___ album won the prize is only 20.",["who","whose","which"],1,"Possession: whose."],
["The film ___ I watched last night was hilarious.",["what","—","whose"],1,"Object of a defining clause: the pronoun can be left out (that or which are also correct). what is never a relative pronoun."],
["He failed the test, ___ surprised everyone.",["that","which","what"],1,"which can refer to the whole previous clause."]]},
{id:"articles",unit:5,lesson:"Unit 5 Lesson 2",title:"Articles",
what:"a/an for one non-specific thing or first mention; the for specific things the reader knows; no article (zero article) for general ideas with uncountable or plural nouns.",
form:["a/an: first mention, one of many, per (three times <b>a</b> week), quantity (<b>a</b> little, <b>a</b> few, <b>a</b> lot)","the: only one, already known, superlatives (<b>the</b> best), ordinal numbers (<b>the</b> first time), the + comparative + of the two, family names (<b>the</b> Windsors)","zero article: general ideas: <b>Technology</b> changes fast. <b>People</b> need sleep.","Regions with direction words: <b>the</b> West, <b>the</b> North","Illnesses: <b>the</b> flu, <b>the</b> measles, <b>a</b> cold"],
uses:[["General idea","Stress affects learning. (not: The stress)"],["Specific","The stress I felt before the exam was terrible."],["Per","I charge my car twice a week."],["Superlative","It's the most efficient panel on the market."]],
mistakes:["<s>The people need to reduce the stress.</s> People need to reduce stress.","<s>He is engineer.</s> He is an engineer.","<s>I have the flu</s> is correct, but <s>I have the cold</s> should be I have a cold."],
practice:[
["___ technology has transformed education.",["The","—","A"],1,"General idea: zero article."],
["She is ___ engineer at the power company.",["—","a","an"],2,"Jobs need a/an; engineer starts with a vowel sound."],
["This is ___ best solution we have.",["a","the","—"],1,"Superlatives use the."],
["I go to the gym three times ___ week.",["the","a","per the"],1,"a = per."],
["I saw a dog and a cat. ___ dog was chasing the cat.",["A","The","—"],1,"Second mention: the."],
["Many people in ___ North want to move to the city.",["the","a","—"],0,"Regions with direction words: the North."]]},
{id:"future",unit:5,lesson:"Unit 5 Lesson 5",title:"Future forms for predictions",
what:"will, be going to and the present continuous all talk about the future, but each has a different reason behind it.",
form:["will + base form: opinions, predictions, decisions made at the moment of speaking","be going to + base form: predictions with evidence, plans made before speaking","present continuous: arrangements with other people or companies","Adverbs of probability: will <b>definitely</b> / will <b>probably</b> / is <b>likely to</b>; negative: <b>definitely won't</b>, <b>probably won't</b>"],
uses:[["Opinion","I think AI will replace many jobs."],["Evidence","Look at those clouds. It's going to rain."],["Arrangement","I'm meeting my supervisor at 10 tomorrow."],["Probability","Prices will probably fall next year."]],
mistakes:["<s>It will rain</s> (when you can see the clouds) It's going to rain.","<s>I will probably not come.</s> I probably won't come.","<s>Tomorrow I meet the dentist.</s> Tomorrow I'm meeting the dentist."],
practice:[
["Look at the traffic! We ___ be late.",["will","are going to","are being"],1,"Evidence now: going to."],
["I'm sure robots ___ do most housework in the future.",["will","are doing","going to"],0,"Opinion / prediction: will."],
["I ___ my cousin at the airport at 6 pm. It's all arranged.",["will meet","am meeting","meet"],1,"Arrangement: present continuous."],
["It ___ rain tomorrow. The forecast says 90%.",["will definitely","definitely will not","is definitely"],0,"definitely goes after will."],
["They ___ finish on time. I'm not sure.",["probably won't","won't probably","will not probably"],0,"probably goes before won't."],
["Electric cars are ___ to become cheaper.",["likely","probably","definitely"],0,"be likely to + base form."]]},
{id:"pspp",unit:6,lesson:"Unit 6 Lesson 2",title:"Past simple vs present perfect",
what:"The past simple talks about finished time and actions. The present perfect connects the past with the present: unfinished time, experiences, or a result now.",
form:["Past simple: verb + -ed / irregular (watched, saw); negative: didn't + base; question: did + subject + base","Present perfect: have/has + past participle (I've met him); negative: haven't/hasn't (never) + participle; question: Have you (ever) + participle?","Past simple time words: yesterday, last week, in 2016, two days ago","Present perfect time words: lately, recently, this week, today, ever, never, for, since"],
uses:[["Finished time","I moved house last year."],["Unfinished time","I've been working hard lately."],["Experience, no time","She's been to this restaurant many times."],["Result now","I've eaten all the cookies (there are none now)."],["News: introduce with present perfect, details with past simple","Darren has won the lottery. He bought the ticket on Monday."]],
mistakes:["<s>I have seen him yesterday.</s> I saw him yesterday.","<s>I know her for ten years.</s> I've known her for ten years.","<s>Did you ever go to Peru?</s> Have you ever been to Peru?"],
practice:[
["I ___ the news on TV last night.",["have watched","watched","watch"],1,"Finished time (last night): past simple."],
["She ___ in Rome for a year. Now she lives in Quito.",["lived","has lived","lives"],0,"Finished period: past simple."],
["I ___ her for over a decade.",["knew","have known","know"],1,"Started in the past and still true: present perfect."],
["Have you ever ___ to Galápagos?",["went","been","gone to"],1,"Experience: have you ever been to."],
["The government ___ new rules. They were announced this morning.",["has introduced","introduced","introduces"],0,"News introduction: present perfect."],
["When ___ you start learning English?",["have","did","do"],1,"When asks about a finished time: past simple."]]},
{id:"pspc",unit:6,lesson:"Unit 6 Lesson 5",title:"Past simple vs past continuous",
what:"The past simple tells finished actions and the main events of a story. The past continuous gives background or shows an action in progress when something else happened.",
form:["Past continuous: was/were + verb-ing (I was making lunch)","when + past simple for the short action; past continuous for the longer one","while + past continuous for two actions in progress at the same time","Comma after the clause when when/while starts the sentence","Spelling: deliver > delivered; manage > managed; marry > married"],
uses:[["Interrupted action","When the phone rang, I was making lunch."],["Two long actions","While you were working out, I was making dinner."],["Story background","The sun was shining and we were sitting in the garden."],["Main events","Her parents moved to New Zealand in 1991 and bought a house."]],
mistakes:["<s>While I cooked, the phone was ringing.</s> While I was cooking, the phone rang.","<s>I was knowing the answer.</s> I knew the answer. (state verbs)","<s>When I arrived he cooked.</s> When I arrived he was cooking (already in progress)."],
practice:[
["He ___ the news when his friend knocked on the door.",["watched","was watching","has watched"],1,"Longer action in progress: past continuous."],
["When the power went off, we ___ dinner.",["had","were having","have"],1,"Action in progress when interrupted."],
["While I ___ at university, I travelled a lot.",["studied","was studying","have studied"],1,"while + past continuous."],
["She ___ her dream job and moved to the city.",["got","was getting","has got"],0,"Main events in a story: past simple."],
["The sun ___ and the birds were singing.",["shone","was shining","has shone"],1,"Background: past continuous."],
["I ___ the answer immediately.",["was knowing","knew","have known"],1,"know is a state verb: no continuous."]]}
];

script:[["H","Good morning and welcome to Business Today. My guest this morning is Daniela Vaca, who started a company that installs solar panels in rural schools in the central Andes. Daniela, thanks for coming in."],["G","Thank you for inviting me. It's a pleasure to be here."],["H","So, let's start at the beginning. Was solar energy something you'd always been interested in?"],["G","Funnily enough, no. At school I was much more interested in biology, and a teacher once told me I should become a vet. And it wasn't a business idea either. My grandmother runs a small dairy farm near Salcedo, and after the long blackouts a couple of years ago, she was losing litres of milk every day because her fridge kept switching off. She called me and asked if I could find a way to keep it cold. I wasn't planning to start a company. I just wanted to help her."],["H","And you did help her, I imagine."],["G","Eventually, yes, but it took months. The first system I built was a disaster, to be honest. The battery was far too small. But I learned a lot from that failure."],["H","When you finished university, what was your first aim? Did you want to start selling the systems straight away?"],["G","A lot of people expect me to say that, but no. Selling in other markets, designing new products, all of that came later. My first goal was simply to get the costs down. Panels and batteries were far too expensive for most rural families, so I spent almost a year comparing suppliers and testing cheaper components before I sold a single system."],["H","You eventually convinced a large electrical company to work with you. That must have been difficult for someone so young. How did you do it?"],["G","People often assume I had contacts there, or that someone in my family worked for them, but I didn't know anyone at all. I'd like to say it was my enthusiasm, and I was certainly enthusiastic, but they told me later that enthusiasm alone wouldn't have been enough. What really persuaded them was the data. I'd recorded two years of measurements from my grandmother's farm, every hour, and that showed them the system really worked in real conditions."],["H","You also have a mentor, don't you? How did the two of you meet?"],["G","Yes, an engineer called Marco, who spent thirty years working on hydroelectric plants. A friend of mine kept telling me I should find a mentor, and I even thought about putting an advert online. But in the end I didn't have to go looking for him. He read an article about my project in a local newspaper and sent me an email offering advice. We've met for lunch every month since then, and he's never charged me a cent."],["H","That's very generous. And what about your studies? I understand you were still at university when the company took off."],["G","That's right. I was in my second year. I loved both, the business and my engineering course, but honestly, I couldn't keep up with everything. My grades started to fall, and I was exhausted all the time. I thought about giving up my degree completely, but my parents persuaded me not to. So I decided to postpone it for a year. I went back last semester, and I'm finishing it now, part-time."],["H","Daniela Vaca, thank you very much."]],
q:[["How did Daniela first become involved in solar energy?","A relative asked her for help.","It was part of a school project.","A teacher suggested it to her.","She saw it as a business opportunity."],["After university, what was her first aim?","to reduce costs","to sell in other markets","to design new products","to start selling straight away"],["Why did the electrical company agree to work with her?","Her data proved the system worked.","She knew one of the managers.","They liked her enthusiasm.","Her family had contacts there."],["How did Daniela meet her mentor?","He contacted her after reading about her.","A friend introduced them.","She found him through an online advert.","They met at a hydroelectric plant."],["During her second year at university, Daniela","decided to delay her studies.","left university for good.","managed both activities easily.","changed her degree."]]},
{title:"Interview with a fact-checking podcaster",intro:"You will hear part of an interview with Tomás Aguirre, who runs a podcast about fake news.",voices:{H:V_.bel,G:V_.lew},
script:[["H","Welcome back to The Media Hour. My guest today is Tomás Aguirre, who runs a podcast that checks the facts behind viral news stories. It now has more than eighty thousand listeners. Tomás, welcome."],["G","Thanks. It's great to be here."],["H","Why did you start the podcast? Was it something you studied?"],["G","Not at all. I studied economics, and for a while I worked in a bank. It actually started at home. My father kept forwarding me stories on WhatsApp, and at least half of them were fake. One said that drinking hot water every hour would protect you from the flu. I began recording short audio messages explaining why each story was wrong, just for him. Then my cousins heard them and asked me to make them public. That was how the podcast began. Nobody asked me to do it, and I certainly wasn't paid."],["H","What was the hardest part at the beginning? The technology?"],["G","Surprisingly, no. Recording is easy these days; you only need a phone and a quiet room. And listeners came quite quickly, which I didn't expect. The hard part was finding reliable sources fast enough. A fake story spreads in a few hours, but some official websites are only updated once a month. So I had to build a network of experts I could call: doctors, engineers, lawyers, people who would answer the phone at nine at night."],["H","People often accuse fact-checkers of having their own bias. How do you stay objective?"],["G","It's a fair question. I'm not going to claim I have no bias. Everyone has. But I can manage it. I have one rule: I never check a story about a topic I feel strongly about. If it's about football or politics, for example, a colleague does it. Some people suggested I should only use government sources, but those can be biased too."],["H","Do you think people are reading less news these days?"],["G","I'd actually say they're consuming more news than ever, just in much smaller pieces. The problem is that they're exposed to headlines, not articles. Our research shows that most people share a story without ever clicking on the link. And print newspapers? Well, my grandparents still read one every day, but I don't think that's where the problem is."],["H","So what's next for you?"],["G","Last year we were offered quite a lot of money by a phone company to sponsor the show. It was tempting, I won't lie, but I turned it down because I want to stay independent. Some friends think I should sell the podcast or move to television. Instead, we're launching a version for teenagers, which we'll take into secondary schools next March. If we can teach fifteen-year-olds to check a source, that's worth more than any sponsor."]],
q:[["Why did Tomás start the podcast?","His family kept sharing false stories.","It was a university assignment.","A company asked him to do it.","He had lost his job at a bank."],["What was the hardest part at the beginning?","finding trustworthy information quickly","learning the technology","attracting listeners","paying for equipment"],["How does Tomás stay objective?","He avoids stories he feels strongly about.","He believes he has no bias.","He only uses official sources.","He asks his listeners to vote."],["What does Tomás say about people today?","They mostly read only headlines.","They read less news than before.","They prefer printed newspapers.","They avoid the news completely."],["What is Tomás planning to do next?","start a project for schools","accept a sponsor","sell the podcast","move to television"]]},
{title:"Interview with a volunteer coordinator",intro:"You will hear part of an interview with Lucía Andrade, who organises volunteers for a children's charity.",voices:{H:V_.mic,G:V_.emm},
script:[["H","With me today is Lucía Andrade, who coordinates more than a hundred volunteers for a children's charity in Ambato. Lucía, how did you get involved in the first place?"],["G","Well, I'd love to say it was a lifelong dream, but I didn't really choose it. My university required forty hours of community service before graduation, and I left it until the last minute, so the charity was the only place that still had places. I didn't know anything about it, and none of my friends worked there. I expected to finish my hours and leave. That was six years ago, and I'm still here."],["H","What surprised you most in those first weeks?"],["G","I'd been told the children needed help with homework, and I'd prepared lots of maths exercises. Some of them did need that, but what they really wanted was someone to listen to them. Many of their parents work long hours, often two jobs, so the kids just wanted to tell an adult about their day. The games and activities were fun, but the most important thing was simply paying attention."],["H","Is it hard to find volunteers?"],["G","Finding them is surprisingly easy. Every semester, dozens of students apply, and they're well prepared, too. Keeping them is the problem. People sign up full of energy, but after a month or so they have exams or new jobs, and they disappear. That's hard for the children, who get attached to them. So now we ask for a minimum of three months, and we match each volunteer with the same child every week."],["H","Has social media helped you?"],["G","It has, but not in the way I expected. I thought our posts would bring in lots of new volunteers, and they don't, really. What they do bring is donations, especially from Ecuadorians living overseas, in Spain or the United States. Last Christmas, almost half of our budget came from people abroad who'd seen our videos."],["H","And your plans for next year?"],["G","We'd like to open a second centre in Latacunga. The local government has already given us permission, and a businessman has lent us a building for free. We even have a waiting list of volunteers. What we're missing is a trained psychologist, someone qualified to work with children who've had difficult experiences. That's who we're looking for now, and we won't open until we find the right person."]],
q:[["Why did Lucía first start working with the charity?","She had to do community hours for her degree.","A friend persuaded her to join.","She wanted experience for her career.","She had been helped by the charity as a child."],["What did the children want most?","someone to pay attention to them","help with their homework","games and activities","new friends of their own age"],["What is the charity's main problem with volunteers?","They don't stay for long.","Not enough people apply.","They are not well prepared.","They don't get on with the children."],["How has social media helped the charity?","It has brought in money from people abroad.","It has attracted many new volunteers.","It has made the charity famous nationally.","It has helped them find a building."],["What does the charity need before opening a new centre?","a qualified professional","a suitable building","more volunteers","government permission"]]}

{title:"Five people talk about success",topic:"success",who:["a university lecturer","a professional athlete","a nurse","a small business owner","a secondary school student","a parent","a software engineer","a music teacher"],
op:["Failure teaches you more than success.","Success depends mainly on luck.","Pressure from others can be harmful.","Small daily habits matter most.","Setting realistic goals is essential.","Money is the best measure of success.","Helping others is the real achievement.","Talent is overrated."],
sp:[["I train six hours a day, and people only see the medals. They think I'm lucky, that I was born with a gift, but luck has nothing to do with it. What they don't see is the race in Lima three years ago, where I fell two metres before the finish line in front of thirty thousand people. I cried for a week and seriously thought about quitting. But that race changed the way I prepare, the way I eat, even the way I sleep. Honestly, I learned more from that disaster than from any gold medal I've won since.",1,0,"dan"],
["When I opened my café in Cuenca, I had big plans. I wanted three branches in a year and my own brand of coffee in every supermarket. My family kept telling me the money would come quickly. Looking back, those plans were completely unrealistic, and they nearly ruined me. I borrowed far too much. Now I set targets I can actually reach, like increasing sales by five per cent each month or training one new barista every season. It sounds boring, but the business is finally growing, and I sleep at night.",3,4,"hea"],
["After a twelve-hour shift on the ward, nobody gives you a prize, and the salary certainly isn't why I do it. Some of my friends from school earn twice what I earn, and they measure success by their cars and their houses. But when a patient's family stops me in the corridor to thank me because their mother is finally going home, that's what success really is for me. It's not about you or your career. It's about the difference you make for someone else, even if nobody ever finds out.",2,6,"isa"],
["My parents compare my grades with my cousin's all the time. She's studying medicine in Quito, and she's always been top of the class. I know they mean well, and they've sacrificed a lot for me, but that constant pressure makes me anxious. Sometimes I can't even concentrate in exams because I'm already imagining the conversation at dinner. My teachers say I've got real talent for design, but at home nobody seems to notice. I honestly think expectations from family can do more harm than good.",4,2,"nic"],
["People imagine programmers having huge breakthroughs at three in the morning, drinking coffee and solving everything in one night. That's a film, not my job. In my experience, it's the boring stuff that works: writing a little code every single day, reviewing it with a colleague, going to bed early, going for a run. My manager calls it the one per cent rule: get one per cent better every day. Those tiny daily routines add up to something big, and that's true outside work too.",6,3,"ada"]]},
{title:"Five people talk about the news",topic:"the news",who:["a newspaper editor","a retired teacher","a radio presenter","a university student","a police officer","a TV camera operator","a social media influencer","a shop owner"],
op:["Local news is more useful than national news.","Headlines often give the wrong impression.","Too much news affects your mood.","Print newspapers will soon disappear.","Reporters should keep their opinions out.","Social media is a reliable source.","The news should include more positive stories.","Young people don't care about the news."],
sp:[["Since I stopped working at the school last year, I've had more free time than ever, and at first I had the TV on all day, mostly the news channels. After a few weeks, I noticed I was always in a bad frame of mind. I wasn't sleeping well, and I was worried about everything. My daughter thought it was because I missed my students, but it wasn't that. My doctor asked me how much news I watched, and when I told her, she laughed. Now I limit it to half an hour in the morning, and I feel much calmer.",1,2,"ali"],
["I've written headlines for thirty years, first for a print newspaper and now for a website, so I know all the tricks. People say print is dying, and maybe it is, but that's not what worries me. A headline has to sell the story in six or seven words, and that pressure means it often gives a slightly false impression of what actually happened. 'Prices explode' might mean prices went up two per cent. My advice to readers is simple: read the second paragraph before you believe the title.",0,1,"eri"],
["Honestly, what happens in Washington or Brussels doesn't change my week at all. My parents watch the national news every night, and they think I don't care about what's going on. I do care, but what I need to know is whether there's a water cut in my neighbourhood, or a strike on the trolleybus before my nine o'clock lecture. That's why I follow the municipal accounts and a couple of neighbourhood groups instead of the big channels. They're far more useful for my real life.",3,0,"sar"],
["Every morning on my show, we read the headlines at seven, and for years it was all doom and gloom: accidents, crime, corruption. Listeners started calling to say they'd switched to music stations. So last year I added a five-minute section with good news: a school that installed solar panels, a farmer from Cotopaxi who won an international award. It isn't propaganda; it's all true. The listeners love it, and our audience has grown. I think every programme should do the same.",2,6,"lew"],
["In my job, I see how quickly rumours spread after a crime. Within an hour, there are ten different versions on social media, and most of them are wrong. That's bad enough. But what really makes our investigations harder is when a reporter adds his personal view to a story, saying a suspect looks guilty, for example. People treat that as fact. Reporters should give the facts and let the public decide what to think. That's their job, not ours.",4,4,"fab"]]},
{title:"Five people talk about living abroad",topic:"living abroad",who:["an exchange student","a chef","a diplomat","a retired engineer","a nurse","a travel blogger","a language teacher","a taxi driver"],
op:["Learning the language is the key to belonging.","Food is the hardest thing to adapt to.","You never stop missing home.","Local people are less friendly than expected.","Living abroad makes you more independent.","Small cultural differences cause the biggest problems.","Moving abroad is easier when you are young.","Technology makes distance less painful."],
sp:[["When I arrived in Toronto for my exchange year, I'd never cooked a meal or paid a bill in my life. My mum did everything for me. The first month was a disaster: I burnt the rice, I forgot to pay my phone bill, and I got lost on the subway twice. I missed home terribly at first, of course. But by December I was managing my own budget, cooking for my flatmates and solving my own problems without calling anyone. I came back a completely different person, much more capable of looking after myself.",0,4,"hea"],
["I've cooked in four countries, so people assume the food was the hardest thing for me. Not at all; I'll eat anything. What caught me out in Japan were the tiny things: bowing at the right moment, never tipping, taking off my shoes in certain restaurants but not in others. In my first year I offended people many times without realising it, and nobody told me, because that would have been impolite too. Those small details caused me far more problems than the language did.",1,5,"dan"],
["I moved to Madrid at sixty-five, after thirty-five years at the power company. My children were worried that I'd be lonely so far from them, and I was a bit worried too. But we talk on video every single day, sometimes twice, and I watch my grandchildren grow up on the screen. I even help them with their homework from here. Thirty years ago, when my own father emigrated, a phone call cost a fortune. This move would have been much harder then.",3,7,"mic"],
["Every new posting, I spend my first six months in language classes, even when everyone at the embassy speaks English. My colleagues sometimes laugh at me for it. But if you can't joke with the person at the market or chat with your neighbour, you're always a visitor, however long you stay. People here aren't unfriendly at all; they just open up when you speak their language. Once you do, doors open that you didn't even know were there.",2,0,"emm"],
["I've lived in London for twelve years, and I love my job at the hospital. I've got good friends here, and I feel independent and settled. But every December, when the Fiestas de Quito are starting back home, I feel it in my chest. I call my sisters, I listen to the music, I even try to cook the food. That feeling of missing home doesn't go away with time, and honestly, I don't think it ever will.",4,2,"lil"]]}

{ctx:"You hear a woman talking to a friend about her new job.",q:"How does she feel about it?",o:["worried that it will be too demanding","pleased with how much she is learning","disappointed with the salary"],a:1,lines:[["ada","So, how's the new job going? Are they keeping you busy?"],["isa","Very! I thought I'd be bored, to be honest, because the salary's lower than at my old place, and I assumed the work would be easier too. But it's the opposite. Every day there's a new system to learn, a new client, a new problem. It's tiring, but I come home feeling I've actually achieved something. I don't mind about the money so much any more."]]},

{title:"Volunteering in the Galápagos",intro:"You will hear a young engineer called Andrés talking about his experience as a volunteer in the Galápagos Islands.",voice:"mic",
text:"Hi everyone. My name's Andrés, and last year I spent four months as a volunteer on San Cristóbal, one of the islands of the Galápagos. I'd like to tell you a bit about the experience, because several of you have asked me how to apply.\nFirst of all, I didn't go there to work with animals, which is what most people imagine. I'd studied electrical engineering, so I joined a project that was replacing diesel generators with solar panels. Of course, I saw sea lions every single day. They sleep on the benches by the harbour, and nobody seems to mind.\nThe application process was simpler than I expected. You need a recommendation letter from a teacher, a short video explaining why you want to go, and a medical certificate. I was worried about the interview, but it lasted only twenty minutes, and it was mostly about teamwork.\nThe volunteers stayed with local families, not in a hotel. My host family ran a small bakery, so I woke up at five every morning to the smell of fresh bread. That was probably my favourite part of the whole trip.\nOur working day started at seven and finished at three, because after that it was too hot to work on the roofs. We usually spent the afternoons at the beach, or teaching English to children at the community centre. I'd never taught before, and I was surprised how much I enjoyed it.\nThe hardest thing for me wasn't the work; it was the water. Fresh water is very limited on the islands, so we could only have a shower for three minutes a day. You learn very quickly how much water we waste at home.\nSome people think volunteering is free, but it isn't. Flights are expensive, and every visitor pays an entrance fee of two hundred dollars when they arrive. The project paid for our food, but we had to cover everything else ourselves. I saved for almost a year before I went.\nSo, what did I learn? Technically, I learned how to install a complete off-grid system, from the panels to the batteries. But more importantly, I learned to be patient. On the islands, if a part breaks, you might wait three weeks for a replacement to arrive by boat.\nIf you're thinking of applying, my advice is to start early. The best projects receive their applications in January, and places go very quickly. And pack a good hat, because the sun there is no joke.\nThanks for listening. I'm happy to answer any questions.",

{title:"A career in renewable energy",intro:"You will hear an engineer called Carla Mena talking to students about her job.",voice:"emm",
text:"Good afternoon. My name is Carla Mena, and I work as a grid engineer for a company that builds wind farms in the south of Ecuador. I've been asked to talk to you about what the job is really like.\nI didn't always want to be an engineer. At school, my favourite subject was history, and I planned to study law. It was a summer job at an electricity company, when I was eighteen, that changed my mind. I spent two months in a control room, watching the whole country's demand change minute by minute, and I was fascinated.\nPeople often ask me what a typical day looks like. The truth is, there isn't one. Some days I'm in the office running simulations on my computer. Other days I'm on a mountain at three thousand metres, checking a turbine in the wind and the rain. I always keep a waterproof jacket in my car.\nThe part of the job I enjoy most is solving problems as a team. When a wind farm suddenly disconnects from the grid, you have maybe an hour to find out why, and nobody can do that alone.\nWhat skills do you need? Maths, of course, and a good understanding of physics. But employers also look for communication skills. I spend a surprising amount of time writing reports and explaining technical ideas to people who aren't engineers, such as politicians and local communities.\nThat last point is important. Before we build anything, we hold meetings with the people who live nearby. Their biggest concern is usually noise, followed by the effect on birds. Listening to them carefully has saved us from making some very expensive mistakes.\nIs it a well-paid job? A starting salary is reasonable, but not spectacular. However, it increases quickly with experience, and there is a lot of demand. In the next ten years, Ecuador will need thousands of engineers who understand renewable energy.\nOne thing I wish I'd known earlier is how useful languages are. Most of the equipment we use comes from Germany or China, and all the manuals are in English. My English was very basic when I started, and I had to take evening classes for two years.\nFinally, my advice. Don't worry if you're not top of the class. Curiosity and determination are worth more than perfect grades. Try to get some practical experience before you finish university, even if it's unpaid.\nThank you very much.",
items:[["At school, Carla planned to study ___.",["law"]],["A ___ at an electricity company made her change her mind.",["summer job"]],["On some days, Carla works on a mountain at ___ metres.",["three thousand","3000","3,000","3.000"]],["Carla always keeps a ___ in her car.",["waterproof jacket"]],["What she enjoys most is solving problems as a ___.",["team"]],["Apart from maths and physics, employers look for ___ skills.",["communication"]],["Local people's biggest concern is usually ___.",["noise"]],["Carla says salaries increase quickly with ___.",["experience"]],["Carla had to take ___ to improve her English.",["evening classes"]],["She believes curiosity and ___ are worth more than perfect grades.",["determination"]]]},
{title:"How false stories spread",intro:"You will hear a journalist called Laura Pérez giving a talk about fake news.",voice:"isa",
text:"Hello, everyone. I'm Laura Pérez, and I've been a journalist for fifteen years, first at a regional newspaper and now at a fact-checking website. Today I want to explain how false stories spread, and what you can do about it.\nLet's start with a surprising fact. Research from a university in the United States found that false stories travel six times faster than true ones on social media. Why? Because they're usually more emotional. A story that makes you angry or frightened is the one you share without thinking.\nThe most common type of false story we see in Ecuador isn't about politics, as many people think. It's about health: miracle cures, dangerous vaccines, things like that. And the place where they spread most isn't public websites. It's family WhatsApp groups.\nSo how can you check a story? I teach a method with three questions. First, who is the source? If you can't find the name of the author or the organisation, be careful. Second, when was it published? Many false stories are actually old news that someone has shared again. Third, what do other sources say? If a story is really important, several serious media will report it.\nPhotos are another problem. A picture of a flood from another country can be shared as if it happened here yesterday. There's a simple trick: do a reverse image search on your phone. It takes about ten seconds, and it often shows you where the photo really came from.\nOf course, professional journalists make mistakes too. The difference is that a good newspaper publishes a correction. When you're choosing a news source, look for one that admits its errors openly. That's a sign you can trust it.\nI'm often asked whether young people are more likely to believe fake news. Our surveys suggest the opposite. Teenagers are generally quite good at spotting false stories. It's actually people over sixty-five who share them most often, usually with good intentions.\nSo, what can you do tomorrow? Before you share anything, wait thirty seconds and ask yourself the three questions. And if a relative shares something false, don't criticise them in the group. Send them a private message instead. People change their minds more easily when they don't feel embarrassed.\nThank you for listening.",
items:[["Laura first worked at a ___.",["regional newspaper"]],["False stories travel ___ faster than true ones.",["six times","6 times"]],["People share stories that make them angry or ___ without thinking.",["frightened"]],["In Ecuador, the most common false stories are about ___.",["health"]],["False stories spread most in family ___.",["WhatsApp groups","whatsapp groups"]],["Many false stories are really ___ that someone has shared again.",["old news"]],["To check a photo, you can do a ___ on your phone.",["reverse image search"]],["A news source you can trust publishes a ___ when it makes a mistake.",["correction"]],["People over ___ share false stories most often.",["sixty-five","65","sixty five"]],["If a relative shares something false, Laura suggests sending a ___.",["private message"]]]}
];
