{title:"Interview with a documentary filmmaker",intro:"You will hear an interview with Sofía Ruiz, a documentary filmmaker.",voices:{I:V_.dan,G:V_.hea},
script:[["I","My guest today is Sofía Ruiz, whose documentary Light in the Forest won the audience award at this year's film festival in Guayaquil. Sofía, congratulations."],["G","Thank you. I'm still a bit shocked, to be honest. We made it with a tiny budget, and I really didn't expect anyone outside Ecuador to watch it."],["I","The film follows an Achuar community in the Amazon as they install solar panels for the first time. How did you find the story?"],["G","Completely by accident. I'd gone to the area to film birds for a nature channel. It was raining, the birds weren't cooperating, and I ended up sheltering in the community school. The teacher told me that in two weeks a team of engineers was coming to install a solar system. I phoned my producer that night and said: forget the birds."],["I","Was the community happy to be filmed?"],["G","Not at first, and I completely understand why. In the past, film crews had come, taken pictures and left, and the community never saw the results. So the elders asked for something in return. We agreed that I would teach two young people from the community how to use a camera, and in the end, a lot of the footage in the film is theirs, not mine."],["I","What was the hardest part of the filming?"],["G","People expect me to say the insects or the heat, and they were bad, believe me. But the real challenge was the equipment. The humidity was so high that our cameras kept steaming up, and we had nowhere to charge the batteries until, ironically, the solar panels were working."],["I","The film has a very calm, slow style. There's no narrator. Was that deliberate?"],["G","Very much so. My first version had a narrator explaining everything, and when I showed it to friends, they said it felt like a school lesson. The people in the community are perfectly able to tell their own story. So I removed the narrator and let them speak. It was a hard decision, because it made the film much longer to edit."],["I","Some critics have said the film is too optimistic. How do you respond to that?"],["G","I think that's fair, in a way. The film ends on the night the lights come on, and it's a beautiful moment. But of course, problems came later: a battery failed after six months, and it took weeks to replace. I'm planning a short extra episode to show that side too. Technology isn't magic; it needs maintenance and money."],["I","What has changed for the community since the film came out?"],["G","The most important thing is that the two young people I trained are now working professionally. One of them has just been hired by a television channel in Quito. The community also received donations, which they've used to buy a second battery, but for me, those two careers are the real success."],["I","And what's next for you?"],["G","Well, I'm definitely not going back to filming birds! Seriously, though, my next project is about the women who run small hydroelectric plants in the mountains of Loja. It's a world almost nobody knows about. We start filming in March, if the funding arrives."]],
q:[["How did Sofía find the story for her documentary?","She heard about it while working on another project.","The engineers contacted her.","Her producer suggested it.",0],["Why did the community agree to be filmed?","They were offered part of the profits.","Some members would learn filming skills.","Earlier film crews had treated them well.",1],["What does Sofía say was the most difficult part of filming?","the effect of the conditions on the equipment","the insects and the heat","the lack of transport",0],["Why did Sofía decide not to use a narrator?","She wanted to save time in editing.","She felt the community should tell its own story.","She couldn't afford a professional narrator.",1],["How does Sofía feel about the criticism that the film is too optimistic?","She partly accepts it.","She thinks the critics misunderstood it.","She is annoyed by it.",0],["What does Sofía consider the film's greatest achievement?","the money raised for the community","the careers of the people she trained","the award at the festival",1],["What is Sofía's next film going to be about?","wildlife in the Amazon","women who run small power plants","the history of hydroelectric energy",1]]},
{title:"Interview with a sports psychologist",intro:"You will hear an interview with Elena Torres, a sports psychologist.",voices:{I:V_.eri,G:V_.ali},
script:[["I","Joining me today is Doctor Elena Torres, a sports psychologist who works with Ecuador's national athletics team. Doctor Torres, what exactly does a sports psychologist do?"],["G","People often imagine I'm there to motivate athletes, to give inspiring speeches before a race. Actually, most top athletes are already extremely motivated, sometimes too much. And I'm not involved in their physical training at all. My job is mainly to help them manage pressure, so that their mind doesn't stand in the way of what their body can already do."],["I","How did you get into this field?"],["G","I was a runner myself, a fairly good one. At nineteen, I was selected for the South American championships, and I froze. I'd trained for years, I wasn't injured, but on the day my legs simply wouldn't respond. Nobody could explain why. That experience made me want to understand what happens in the mind under pressure, so I studied psychology instead of continuing to compete."],["I","Is pressure always negative?"],["G","Not at all. A certain amount of pressure improves performance; it sharpens your focus. The problem starts when athletes stop seeing a competition as a challenge and start seeing it as a threat. The body reacts in a completely different way. So we work on how they interpret the situation, not on removing the pressure."],["I","Could you give us an example of a technique you use?"],["G","One of the simplest is what we call a routine. Before every jump, a high jumper might take three breaths, touch her shoes and say one key word to herself. It sounds almost silly, but it gives the mind something familiar to hold on to when everything else feels overwhelming. It puts the athlete back in control. Some athletes use the same routine for their whole career."],["I","What about social media? Has it changed your work?"],["G","Enormously. Ten years ago, an athlete who had a bad race would read a few comments in the newspaper. Now they get thousands of messages within minutes, some of them very cruel. Several of my athletes have deleted the apps during competitions. I don't tell them to do that, and I don't pretend they can simply ignore the comments. But I do ask them to decide in advance when they'll check their phones."],["I","Do you work with parents as well?"],["G","With the younger athletes, yes, and often it's the most important part. Parents usually mean well, but some of them comment on every mistake after a race. I suggest they ask one question instead: did you enjoy it? Children who enjoy the sport stay in it longer, and in the end, they usually achieve more."],["I","Finally, can your ideas help people who aren't athletes?"],["G","Absolutely. Exams, job interviews, presentations at work: they all involve the same mental processes. In fact, I'm writing a book at the moment for students preparing for university entrance exams. The techniques are exactly the same; only the setting is different."]],
q:[["According to Dr Torres, what is the main purpose of her work?","to motivate athletes before competitions","to help athletes deal with pressure","to improve athletes' physical fitness",1],["Why did she decide to study psychology?","She was injured and could no longer run.","A poor performance made her curious about the mind.","Her coach advised her to change careers.",1],["What does she say about pressure?","It should be avoided whenever possible.","It can be useful if athletes see it as a challenge.","It affects young athletes more than older ones.",1],["Why does she recommend routines?","They make athletes feel more in control.","They reduce physical tiredness.","They help athletes remember technical details.",0],["What does she advise athletes to do about social media?","delete their accounts","plan when they will check it","ignore negative comments",1],["What does she suggest parents should do after a competition?","analyse their child's mistakes","ask whether their child enjoyed it","compare results with other children",1],["What is Dr Torres currently working on?","a programme for job interviews","a book for students taking exams","a training plan for presenters",1]]}
];

Introduction\nThe aim of this report is to describe how students at our institute get their news and to suggest improvements.\n\nMain sources\nThe majority of students use social media, especially Instagram and TikTok. Only a few read newspapers in print, and almost nobody watches the national news on TV.\n\nProblems\nIt was found that many students share headlines without reading the article. As a result, misleading stories spread quickly. Several students also said that the constant doom and gloom affects their mood.\n\nRecommendations\nIt is recommended that the institute organise a short workshop on checking sources. In addition, the library could offer free access to a reliable online newspaper. Should these measures be adopted, students would become more critical readers.":[48.987,51.811],"Proposal: Saving energy at our institute\n\nIntroduction\nThe purpose of this proposal is to suggest ways to reduce energy consumption in our building.\n\nCurrent situation\nAt present, lights and air conditioning stay on in empty classrooms, and many computers are never switched off. As a result, the electricity bill has risen considerably.\n\nSuggestions\nFirstly, I would suggest installing motion sensors in corridors and bathrooms. Secondly, the old fluorescent tubes could be replaced with LED lamps, which use far less energy. Finally, a student team could check every classroom at the end of the day.\n\nBenefits\nThese measures would not only save money but also show students how small changes can make a difference. I strongly believe that the investment would pay for itself within two years.":[101.297,48.903],"Dear Mr Paredes,\n\nI am writing to complain about the theft of my bicycle from the building's car park on 14 October.\n\nWhen I signed the contract, I was told that the car park was monitored by security cameras. However, when I reported the theft, the security guard admitted that the cameras had not been working for two weeks. Nobody had informed the residents about this problem.\n\nI would be grateful if you could explain why the cameras were not repaired and whether the building's insurance covers stolen property. I would also like to know what measures you will take to prevent similar thefts in the future.\n\nI look forward to hearing from you.\n\nYours sincerely,\nAndrea Vaca":[150.7,39.735],"Hi Sam,\n\nThanks for your email! It's great that you're coming to Ecuador next month.\n\nYou asked about customs here. People are really friendly, but they greet everyone with a kiss on the cheek, so don't be surprised. Also, it's quite normal to arrive a bit late to parties, which might feel weird at first.\n\nIf I were you, I'd bring a warm jacket. Quito can be cold at night, even though it's on the equator! And don't miss the Diablada in Píllaro if you're here in January. It's an amazing festival.\n\nCan't wait to see you!\n\nTake care,\nLuis":[190.935,35.403],"Power to the People: a must-see series\n\nIf you think energy is boring, this documentary series will change your mind.\n\nIt tells the story of engineers, farmers and politicians who are trying to transform Ecuador's electricity system after years of drought. Each episode follows a different community, from a fishing village in Manabí to a school in the Amazon.\n\nWhat makes the series special is its camera work. The drone shots of the Paute dam are breathtaking, and the soundtrack fits perfectly. My only criticism is that some technical terms are never explained, which might confuse the lay person.\n\nOverall, it's a gripping and touching series that is well worth watching. I would definitely recommend it to anyone who wants to understand the future of our country.":[226.837,43.807],"The girl who brought light to her village\n\nHave you ever wondered what it would be like to study by candlelight? For Rosa, a teenager from a small community in the Amazon, that was everyday life.\n\nWhen she was fifteen, Rosa decided that things had to change. With no money and no engineering experience, she wrote to universities and companies asking for help. Most of them never replied, but she refused to give up. Eventually, a group of students from Quito agreed to install solar panels in her school.\n\nNot only did the project bring electricity to forty children, but it also inspired Rosa to study engineering herself. What impressed me most was her determination. She overcame the odds simply because she believed in herself.\n\nSo, next time you face an obstacle, think of Rosa.":[271.144,45.825],"Salcedo: the city of ice cream\n\nHave you ever wondered what it would be like to live in a city famous for ice cream? Welcome to Salcedo, a small city in Cotopaxi province.\n\nMost people in Salcedo speak Spanish, although Kichwa is still spoken in nearby communities. Their culture has roots in both indigenous and Spanish traditions.\n\nThe city is known for its fruit ice creams, which are sold on every corner. Every year, the city celebrates its foundation with parades, music and dancers in colourful costumes.\n\nTraditionally, most people made a living from farming, especially milk and vegetables. Over the last decade, however, tourism has become increasingly important, and many families now run small restaurants.\n\nWhat makes Salcedo unique is the warmth of its people. It is well worth a visit.":[317.469,48.287]},"pron2":{"She apologised for being late.":[0.5,1.835],"Is it rude to arrive early?":[2.835,1.792],"How did you cope with culture shock?":[5.127,1.899],"It seems that you've settled in nicely.":[7.525,2.112],"When I lived abroad, I missed my family.":[10.137,2.24],"The suspect was arrested last night.":[12.877,2.155],"Where did the robbery take place?":[15.532,1.749],"You don't have to give your name.":[17.781,1.621],"Shoplifting is a crime, isn't it?":[19.903,1.941],"Did the witness tell the truth?":[22.344,1.664],"What helped me most was my family.":[24.508,1.963],"She's far more confident than she was.":[26.971,2.133],"Never give up on yo d communication. Families who live overseas can talk every day, and students can find information in seconds. Nevertheless, these advantages only help us if we use them wisely.\n\nAll things considered, technology itself is not the problem. The way we use it is. If we set clear limits, such as switching off notifications after dinner, we can enjoy the benefits without the stress.":[0.5,49.885],"Report: How students get their news\n\nIntroduction\nThe aim of this report is to describe how students at our institute get their news and to suggest improvements.\n\nMain sources\nThe majority of students use social media, especially Instagram and TikTok. Only a few read newspapers in print, and almost nobody watches the national news on TV.\n\nProblems\nIt was found that many students share headlines without reading the article. As a result, misleading stories spread quickly. Several students also said that the constant doom and gloom affects their mood.\n\nRecommendations\nIt is recommended that the institute organise a short workshop on checking sources. In addition, the library could offer free access to a reliable online newspaper. Should these measures be adopted, students would become more critical readers.":[50.885,53.944],"Proposal: Saving energy at our institute\n\nIntroduction\nThe purpose of this proposal is to suggest ways to reduce energy consumption in our building.\n\nCurrent situation\nAt present, lights and air conditioning stay on in empty classrooms, and many computers are never switched off. As a result, the electricity bill has risen considerably.\n\nSuggestions\nFirstly, I would suggest installing motion sensors in corridors and bathrooms. Secondly, the old fluorescent tubes could be replaced with LED lamps, which use far less energy. Finally, a student team could check every classroom at the end of the day.\n\nBenefits\nThese measures would not only save money but also show students how small changes can make a difference. I strongly believe that the investment would pay for itself within two years.":[105.329,51.335],"Dear Mr Paredes,\n\nI am writing to complain about the theft of my bicycle from the building's car park on 14 October.\n\nWhen I signed the contract, I was told that the car park was monitored by security cameras. However, when I reported the theft, the security guard admitted that the cameras had not been working for two weeks. Nobody had informed the residents about this problem.\n\nI would be grateful if you could explain why the cameras were not repaired and whether the building's insurance covers stolen property. I would also like to know what measures you will take to prevent similar thefts in the future.\n\nI look forward to hearing from you.\n\nYours sincerely,\nAndrea Vaca":[157.164,41.356],"Hi Sam,\n\nThanks for your email! It's great that you're coming to Ecuador next month.\n\nYou asked about customs here. People are really friendly, but they greet everyone with a kiss on the cheek, so don't be surprised. Also, it's quite normal to arrive a bit late to parties, which might feel weird at first.\n\nIf I were you, I'd bring a warm jacket. Quito can be cold at night, even though it's on the equator! And don't miss the Diablada in Píllaro if you're here in January. It's an amazing festival.\n\nCan't wait to see you!\n\nTake care,\nLuis":[199.02,35.339],"Power to the People: a must-see series\n\nIf you think energy is boring, this documentary series will change your mind.\n\nIt tells the story of engineers, farmers and politicians who are trying to transform Ecuador's electricity system after years of drought. Each episode follows a different community, from a fishing village in Manabí to a school in the Amazon.\n\nWhat makes the series special is its camera work. The drone shots of the Paute dam are breathtaking, and the soundtrack fits perfectly. My only criticism is that some technical terms are never explained, which might confuse the lay person.\n\nOverall, it's a gripping and touching series that is well worth watching. I would definitely recommend it to anyone who wants to understand the future of our country.":[234.859,47.135],"The girl who brought light to her village\n\nHave you ever wondered what it would be like to study by candlelight? For Rosa, a teenager from a small community in the Amazon, that was everyday life.\n\nWhen she was fifteen, Rosa decided that things had to change. With no money and no engineering experience, she wrote to universities and companies asking for help. Most of them never replied, but she refused to give up. Eventually, a group of students from Quito agreed to install solar panels in her school.\n\nNot only did the project bring electricity to forty children, but it also inspired Rosa to study engineering herself. What impressed me most was her determination. She overcame the odds simply because she believed in herself.\n\nSo, next time you face an obstacle, think of Rosa.":[282.493,48.065],"Salcedo: the city of ice cream\n\nHave you ever wondered what it would be like to live in a city famous for ice cream? Welcome to Salcedo, a small city in Cotopaxi province.\n\nMost people in Salcedo speak Spanish, although Kichwa is still spoken in nearby communities. Their culture has roots in both indigenous and Spanish traditions.\n\nThe city is known for its fruit ice creams, which are sold on every corner. Every year, the city celebrates its foundation with parades, music and dancers in colourful costumes.\n\nTraditionally, most people made a living from farming, especially milk and vegetables. Over the last decade, however, tourism has become increasingly important, and many families now run small restaurants.\n\nWhat makes Salcedo unique is the warmth of its people. It is well worth a visit.":[331.059,50.549]},"pron2":{"She apologised for being late.":[0.5,1.813],"Is it rude to arrive early?":[2.813,1.536],"How did you cope with culture shock?":[4.849,1.813],"It seems that you've settled in nicely.":[7.163,2.027],"Wh function words(t){return (String(t).trim().match(/[A-Za-zÀ-ÿ0-9'’-]+/g)||[]).length}
const ERR=[
{re:/\bone of the (?:\w+ )?(?:best|most|main|biggest|greatest|worst|largest|few|top|key)\s+([a-z]+)\b/gi,test:m=>!/s$/i.test(m[1]),msg:"After 'one of the ...' use a plural noun: one of the best ways.",tag:"Agreement"},
{re:/\b(?:these|those|many|several|both|various)\s+([a-z]+)\b/gi,test:m=>!/s$/i.test(m[1])&&!/^(people|children|men|women|of|are|were|have|kind|data|media|criteria|phenomena|days|who|which|new|young|old|other|different|small|big|important)$/i.test(m[1]),msg:"After these / those / many / several use a plural noun.",tag:"Agreement"},
{re:/\b(people|students|results|they|we|studies|children|families|citizens|researchers|experts|teenagers|users)\s+(is|was|has|shows|says|thinks|needs|wants|does|believes)\b/gi,msg:"A plural subject needs a plural verb: the results show, people are.",tag:"Subject and verb"},
{re:/\b(\w+)\s+(he|she|it|everyone|everybody|nobody|someone)\s+(have|are|were|need|want|think|say|go|make|live|work)\b/gi,test:m=>!/^(does|did|do|will|would|can|could|should|must|might|may|to|let|make|help|if|whether|wish|as|though|that)$/i.test(m[1])&&!/^(if)$/i.test(m[1]),msg:"A singular subject needs -s in the present: she has, it makes, everyone wants.",tag:"Subject and verb"},
{re:/\bthe (people|society|technology|stress|nature|money|education|pollution|music|health|happiness|success|failure|culture|crime|violence)\b(?! of| in| who| that| which| I | we | they| from| at| on| you| he| she)/gi,msg:"General ideas take no article: reduce stress, technology changes fast.",tag:"Articles"},
{re:/(?:^|[.!?]\s+)(Learn|Read|Use|Follow|Watch|Study|Travel|Live|Practise|Practice|Eat|Spend|Have|Make|Take)\s+(?:[a-z]+\s+){0,4}(is|are|can|helps|makes|will|has|was)\b/g,msg:"Use a gerund as the subject: Following these recommendations is..., Learning English helps...",tag:"Gerund subject"},
{re:/,\s+(it|this|they|he|she|we|there|that)\s+(is|are|was|were|has|have|can|will|makes|made|means|helps)\b/gi,msg:"Possible comma splice: two full sentences joined by a comma. Use a full stop, a semicolon or 'which'.",tag:"Punctuation"},
{re:/\b(know|wonder|wondered|tell me|ask|asked|explain|understand|sure|idea|imagine|imagined)\s+(how|what|where|why|when|which|who)\s+(can|could|would|will|do|does|did|is|are|was|were|should|has|have)\s+(i|you|we|they|he|she|it|people|the)\b/gi,msg:"Indirect question: subject before the verb. Say 'how you could reduce', 'what it would be like'.",tag:"Indirect questions"},
{re:/\bon base of\b/gi,msg:"Fixed expression: based on.",tag:"Expressions"},
{re:/\bdepend(s|ed|ing)? of\b/gi,msg:"depend on, not depend of.",tag:"Expressions"},
{re:/\bdiscuss(ed|es|ing)? about\b/gi,msg:"discuss something (no 'about').",tag:"Expressions"},
{re:/\bexplain(ed|s)? (me|us|him|her|them)\b/gi,msg:"explain something to someone: explain it to me.",tag:"Expressions"},
{re:/\bmore (better|worse|bigger|easier|cheaper|faster)\b/gi,msg:"Don't use more with -er comparatives: much better.",tag:"Comparisons"},
{re:/\b(informations|advices|furnitures|equipments|homeworks|knowledges|researches|evidences)\b/gi,msg:"This noun is uncountable: no -s.",tag:"Nouns"},
{re:/\bin the other hand\b/gi,msg:"on the other hand.",tag:"Expressions"},
{re:/\bthe every ?day life\b|\bevery day life\b/gi,msg:"everyday life (adjective, one word).",tag:"Expressions"},
{re:/\b(is|are|be|very|more)\s+open mind\b/gi,msg:"Use the adjective: open-minded.",tag:"Expressions"},
{re:/\bif (i|you|we|they|he|she|it) would have\b/gi,msg:"Third conditional: if + had + past participle (If I had known...).",tag:"Conditionals"},
{re:/\b(must|should|can|could|might) to\b/gi,msg:"Modal verbs are followed by the base form without 'to'.",tag:"Modals"},

function checkWriting(text,type,notes){const t=String(text);const n=words(t);const paras=t.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(Boolean);const issues=[];const hits=[];
ERR.forEach(r=>{r.re.lastIndex=0;let m;while((m=r.re.exec(t))){if(r.test&&!r.test(m))continue;if(r.tag==="Capitals"&&r.msg.startsWith("Languages")&&/^[A-Z]/.test(m[0]))continue;hits.push({i:m.index+(m[0].length-m[0].trimStart().length),len:m[0].trim().length,msg:r.msg,tag:r.tag,txt:m[0].trim()});if(m[0].length===0)r.re.lastIndex++}});
const formal=["essay","report","proposal","formal"].includes(type);
if(formal){const c=t.match(/\b\w+'(t|re|ve|ll|m|d)\b/g);if(c)issues.push(["Style",`Avoid contractions in formal writing (${[...new Set(c)].slice(0,4).join(", ")}).`])}
if(n<140)issues.push(["Length",`Too short: ${n} words. Write 140-190.`]);else if(n>190)issues.push(["Length",`Too long: ${n} words. Cut to 190 or fewer.`]);
const heads=paras.filter(p=>words(p)<=6&&!/[.!?,]$/.test(p));
if((type==="report"||type==="proposal")&&heads.length<3)issues.push(["Task",`A ${type} needs a title and clear headings for each section (found ${heads.length}).`]);
if(["review","article","profile"].includes(type)&&!(paras[0]&&words(paras[0])<=10&&!/[.]$/.test(paras[0])))issues.push(["Task","Give your text a title."]);

if(paras.length<4&&n>60)issues.push(["Organisation",`Only ${paras.length} paragraph${paras.length===1?"":"s"}. Use at least four.`]);
const missing=(notes||[]).filter(no=>{const k=no.toLowerCase().replace(/\(.*?\)/g,"").split(/[^a-z]+/).filter(x=>x.length>3);return k.length&&!k.some(x=>t.toLowerCase().includes(x.slice(0,Math.max(4,x.length-3))))});

const html=`<div class="card soft" style="gap:12px"><div class="row"><h3>Automatic check</h3><span class="score" style="font-size:1.5rem">${score}/10 <span class="sub" style="font-size:.8rem;font-weight:400">estimate</span></span></div>
<div class="grid3"><div class="lvcount">Content ${Math.max(0,content)}/3</div><div class="lvcount">Organisation ${Math.max(0,org)}/2.5</div><div class="lvcount">Range ${rng.toFixed(1)}/2.5</div><div class="lvcount">Accuracy ${acc}/2</div></div>
${issues.length?`<div><span class="label">Task and organisation</span><ul class="clean fb">${issues.map(i=>`<li><b>${esc(i[0])}.</b> ${esc(i[1])}</li>`).join("")}</ul></div>`:""}
${hits.length?`<div><span class="label">Possible mistakes (${hits.length})</span><ul class="clean fb">${hits.map(h=>`<li><mark class="mark-err">${esc(h.txt)}</mark> <b>${esc(h.tag)}.</b> ${esc(h.msg)}</li>`).join("")}</ul></div><div><span class="label">Your text</span><p class="model">${marked}</p></div>`:`<p class="ok"><b>No common mistakes found.</b> Read it once more for spelling.</p>`}
<div><span class="label">Grammar range</span><p>${range.length?`Used: ${range.map(esc).join(", ")}.`:"No advanced structures found yet."} ${RANGE.filter(r=>!range.includes(r[0])).slice(0,3).map(r=>r[0]).length?`Try adding: ${RANGE.filter(r=>!range.includes(r[0])).slice(0,3).map(r=>r[0]).join(", ")}.`:""}</p></div>
